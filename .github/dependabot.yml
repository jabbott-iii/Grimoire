# Syntax verified against docs.github.com on 2026-11-16, and `commit-message` on 2026-11-24
# (DEPENDABOT in docs/specs.md).
# Every entry sets a cooldown of at least 7 days for version updates; security updates are never delayed.
# The docker entry's cooldown has no effect for gcr.io (see below), so its updates are checked by hand.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    # The github-actions ecosystem supports default-days only.
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Action bumps change workflows, which .claude/rules/commits.md types as `ci`, so their
    # messages read `ci(deps): …`. The other entries keep the prefix that Dependabot detects
    # from the history, `build(deps): …`.
    commit-message:
      prefix: "ci"
      include: "scope"

  # Bumps the pinned toolchain in rust-toolchain.toml. The MSRV (rust-version) is never changed by Dependabot.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 7

  # The hash-pinned twine.txt (compiled from twine.in) that release.yml's verify-linux installs.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      pip-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  # The Dockerfile's base image, pinned by digest (ADR-0011). Dependabot dates Docker updates
  # only from Docker Hub; for gcr.io it can't, and proposes a new digest at once instead of
  # waiting (BASE-IMAGE-P6). Before merging, check that the digest is at least 7 days old:
  # docs/release.md §6 shows how. Docker images get no Dependabot security updates; the
  # weekly image scan in security.yml covers them.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 7
