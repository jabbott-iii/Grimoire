# The release pipeline: a dry-run on every pull request and push, and the real release
# from main once the maintainer turns it on (repository variable GRIMOIRE_RELEASES=enabled).
#
#   plan -> build (matrix) -> package -> verify-install (matrix) + verify-linux
#     dry-run: -> sign-dry-run (cosign, throwaway key, offline)
#     release: -> attest + attest-sbom (matrix) -> publish (environment `release`)
#              -> publish-crates (`crates-io`) + publish-npm (`npm`) + publish-pypi (`pypi`)
#   release-checks: one stable result for the ruleset to require.
#
# `cargo --locked xtask release` holds the logic (ADR-0009); this file is glue. Every channel ships
# the same signed bytes: the archives built here, and the npm packages and wheels made from them.
#
# Hardening rules (zizmor pedantic), as in ci.yml: permissions {} at the top with minimal per-job
# grants, full-SHA pins with version comments, persist-credentials: false, no ${{ }} in run:
# steps, no caches anywhere. Action SHAs and tool checksums were verified on 2026-11-17, and every
# pinned action or tool was a release at least 7 days old when adopted (the Dependabot cooldown).
name: Release

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# Pull requests cancel superseded runs. Runs on main queue instead, so a release is never cut off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # actions/setup-node installs this Node.js, which bundles npm 11.19.1. Every job that packs or
  # publishes npm packages asserts that npm version: staged publishing needs npm >= 11.15.0.
  NODE_VERSION: "24.22.3"
  NPM_VERSION: "11.19.1"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      targets: ${{ steps.plan.outputs.targets }}
      crates: ${{ steps.plan.outputs.crates }}
      archives: ${{ steps.plan.outputs.archives }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      # mode is `dry-run` unless this is a push or manual run on main with releases enabled;
      # then `release`, or `skip` when tag v{version} already exists on origin.
      - name: Plan the run
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GRIMOIRE_RELEASES: ${{ vars.GRIMOIRE_RELEASES }}
        run: >-
          cargo --locked xtask release plan
          --event "${EVENT_NAME}"
          --ref "${GITHUB_REF}"
          --releases-enabled "${GRIMOIRE_RELEASES}"
          --github-output "${GITHUB_OUTPUT}"

  build:
    name: build (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and the target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "${TARGET}"
      - name: Install cargo-auditable
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-auditable@0.7.7
          # Fail rather than fall back to an unverified cargo-binstall download.
          fallback: none
      # Builds natively, runs each binary with --version and writes the flat, reproducible archives.
      - name: Build and archive
        env:
          TARGET: ${{ matrix.target }}
        run: cargo --locked xtask release build --target "${TARGET}" --out dist
      - name: Upload the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  package:
    name: package channels and checksums
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Later jobs download these artifacts by ID and check SHA256SUMS against this hash, so a
    # same-named artifact uploaded by another job of the run is never what gets signed.
    outputs:
      dist-artifact-id: ${{ steps.upload-dist.outputs.artifact-id }}
      work-artifact-id: ${{ steps.upload-work.outputs.artifact-id }}
      sums-sha256: ${{ steps.sums.outputs.sha256 }}
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      # Checked against the release's own sha256.sum.
      CYCLONEDX_VERSION: "0.5.10"
      CYCLONEDX_SHA256: "528be9dd99ae522c3ee14fb881fd0cbf51767e8f12b74248f437e6a66b1a3c1b"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      # Unpacked outside the checkout. dist-built tarballs hold one top-level directory.
      - name: Install cargo-cyclonedx (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cargo-cyclonedx"
          cd "${RUNNER_TEMP}/cargo-cyclonedx"
          curl -fsSLo cargo-cyclonedx.tar.xz "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CYCLONEDX_VERSION}/cargo-cyclonedx-x86_64-unknown-linux-musl.tar.xz"
          echo "${CYCLONEDX_SHA256}  cargo-cyclonedx.tar.xz" | sha256sum -c -
          tar -xJf cargo-cyclonedx.tar.xz cargo-cyclonedx-x86_64-unknown-linux-musl/cargo-cyclonedx
          echo "${RUNNER_TEMP}/cargo-cyclonedx/cargo-cyclonedx-x86_64-unknown-linux-musl" >> "${GITHUB_PATH}"
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Check the npm version
        run: |
          set -euo pipefail
          actual="$(npm --version)"
          if [ "${actual}" != "${NPM_VERSION}" ]; then
            echo "::error::expected npm ${NPM_VERSION}, found ${actual}"
            exit 1
          fi
      # Archive names are unique per target, so merging the artifacts cannot collide.
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: Write the SBOMs
        run: cargo --locked xtask release sbom --dist dist
      # Pull request dry-runs build one target per OS, so the channels are generated --partial.
      - name: Generate the channel files
        run: |
          set -euo pipefail
          partial=()
          if [ "${MODE}" = "dry-run" ]; then partial=(--partial); fi
          cargo --locked xtask release channels --dist dist --work work "${partial[@]}"
      - name: Pack the npm packages
        run: |
          set -euo pipefail
          for pkg in work/npm/*/; do
            npm pack --ignore-scripts --pack-destination dist "./${pkg%/}"
          done
      - name: Write SHA256SUMS
        run: cargo --locked xtask release checksums --dist dist
      - name: Verify the release assets
        run: |
          set -euo pipefail
          partial=()
          if [ "${MODE}" = "dry-run" ]; then partial=(--partial); fi
          cargo --locked xtask release verify --dist dist "${partial[@]}"
      - name: Record the SHA-256 of SHA256SUMS
        id: sums
        run: echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
      - name: Upload the release assets
        id: upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
      # JSON twins of the winget manifests, for schema validation in verify-linux.
      - name: Upload the winget JSON twins
        id: upload-work
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-work
          path: work/winget-json/
          if-no-files-found: error

  verify-install:
    name: verify install (${{ matrix.target }})
    needs: [plan, package]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    # Only artifacts of this run are read, which needs no token permission.
    permissions: {}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      # The good server serves dist/; the other serves this target's archive with bytes appended.
      # The rendered install.sh must install the right binary from the first and refuse the second.
      - name: Test install.sh against a local server
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          expected="grimoire ${VERSION}"
          archive="agent-grimoire-${VERSION}-${TARGET}.tar.gz"
          pids=()
          trap 'kill "${pids[@]}" 2>/dev/null || true' EXIT
          serve() {
            python3 -m http.server --bind 127.0.0.1 --directory "$1" "$2" >"${RUNNER_TEMP}/http-$2.log" 2>&1 &
            pids+=("$!")
            for _ in $(seq 1 30); do
              if curl -fs -o /dev/null "http://127.0.0.1:$2/SHA256SUMS"; then return 0; fi
              sleep 1
            done
            cat "${RUNNER_TEMP}/http-$2.log"
            echo "::error::the test server on port $2 did not start"
            return 1
          }
          tampered="${RUNNER_TEMP}/tampered"
          mkdir -p "${tampered}" "${RUNNER_TEMP}/expected"
          cp dist/SHA256SUMS "dist/${archive}" "${tampered}/"
          printf 'tampered' >> "${tampered}/${archive}"
          tar -xzf "dist/${archive}" -C "${RUNNER_TEMP}/expected" grimoire
          serve dist 8765
          serve "${tampered}" 8766

          dir="${RUNNER_TEMP}/install-sh/bin"
          GRIMOIRE_DOWNLOAD_URL="http://127.0.0.1:8765" sh dist/install.sh --to "${dir}"
          actual="$("${dir}/grimoire" --version)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::install.sh installed a grimoire that prints '${actual}', expected '${expected}'"
            exit 1
          fi
          if ! cmp "${dir}/grimoire" "${RUNNER_TEMP}/expected/grimoire"; then
            echo "::error::install.sh did not install the ${TARGET} binary"
            exit 1
          fi

          bad="${RUNNER_TEMP}/install-sh-tampered/bin"
          if GRIMOIRE_DOWNLOAD_URL="http://127.0.0.1:8766" sh dist/install.sh --to "${bad}"; then
            echo "::error::install.sh accepted a tampered archive"
            exit 1
          fi
          if [ -e "${bad}/grimoire" ]; then
            echo "::error::install.sh left a binary behind after rejecting a tampered archive"
            exit 1
          fi
          echo "install.sh rejected the tampered archive"
      # The same checks for install.ps1, under PowerShell 7 (pwsh) and Windows PowerShell 5.1.
      # -ExecutionPolicy Bypass applies to that one process only.
      - name: Test install.ps1 against a local server (pwsh and Windows PowerShell)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          expected="grimoire ${VERSION}"
          archive="agent-grimoire-${VERSION}-${TARGET}.zip"
          tmp="$(cygpath -m "${RUNNER_TEMP}")"
          pids=()
          trap 'kill "${pids[@]}" 2>/dev/null || true' EXIT
          serve() {
            python -m http.server --bind 127.0.0.1 --directory "$1" "$2" >"${tmp}/http-$2.log" 2>&1 &
            pids+=("$!")
            for _ in $(seq 1 30); do
              if curl -fs -o /dev/null "http://127.0.0.1:$2/SHA256SUMS"; then return 0; fi
              sleep 1
            done
            cat "${tmp}/http-$2.log"
            echo "::error::the test server on port $2 did not start"
            return 1
          }
          tampered="${tmp}/tampered"
          mkdir -p "${tampered}"
          cp dist/SHA256SUMS "dist/${archive}" "${tampered}/"
          printf 'tampered' >> "${tampered}/${archive}"
          python -m zipfile -e "dist/${archive}" "${tmp}/expected"
          serve dist 8765
          serve "${tampered}" 8766

          for shell in pwsh powershell; do
            dir="${tmp}/install-ps1-${shell}"
            GRIMOIRE_DOWNLOAD_URL="http://127.0.0.1:8765" "${shell}" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File dist/install.ps1 -InstallDir "${dir}"
            actual="$("${dir}/grimoire.exe" --version)"
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::install.ps1 (${shell}) installed a grimoire that prints '${actual}', expected '${expected}'"
              exit 1
            fi
            if ! cmp "${dir}/grimoire.exe" "${tmp}/expected/grimoire.exe"; then
              echo "::error::install.ps1 (${shell}) did not install the ${TARGET} binary"
              exit 1
            fi

            bad="${tmp}/install-ps1-${shell}-tampered"
            if GRIMOIRE_DOWNLOAD_URL="http://127.0.0.1:8766" "${shell}" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File dist/install.ps1 -InstallDir "${bad}"; then
              echo "::error::install.ps1 (${shell}) accepted a tampered archive"
              exit 1
            fi
            if [ -e "${bad}/grimoire.exe" ]; then
              echo "::error::install.ps1 (${shell}) left a binary behind after rejecting a tampered archive"
              exit 1
            fi
            echo "install.ps1 (${shell}) rejected the tampered archive"
          done
      # A throwaway project that depends on the two local tarballs. The launcher's other optional
      # dependencies are not on the registry yet; npm skips optional dependencies it cannot fetch.
      - name: Test the npm packages
        run: |
          set -euo pipefail
          case "${TARGET}" in
            x86_64-unknown-linux-musl) platform=linux-x64 ;;
            aarch64-unknown-linux-musl) platform=linux-arm64 ;;
            x86_64-apple-darwin) platform=darwin-x64 ;;
            aarch64-apple-darwin) platform=darwin-arm64 ;;
            x86_64-pc-windows-msvc) platform=win32-x64 ;;
            aarch64-pc-windows-msvc) platform=win32-arm64 ;;
            *) echo "::error::no npm package for ${TARGET}"; exit 1 ;;
          esac
          expected="grimoire ${VERSION}"
          project="${RUNNER_TEMP}/npm-project"
          if [ "${RUNNER_OS}" = "Windows" ]; then project="$(cygpath -m "${project}")"; fi
          mkdir -p "${project}"
          cp "dist/agent-grimoire-${platform}-${VERSION}.tgz" "dist/agent-grimoire-${VERSION}.tgz" "${project}/"
          cd "${project}"
          cat > package.json <<EOF
          {
            "private": true,
            "dependencies": {
              "@agent-grimoire/${platform}": "file:./agent-grimoire-${platform}-${VERSION}.tgz",
              "agent-grimoire": "file:./agent-grimoire-${VERSION}.tgz"
            }
          }
          EOF
          npm install --ignore-scripts --no-audit --no-fund
          actual="$(npx --no-install grimoire --version)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::the npm launcher printed '${actual}', expected '${expected}'"
            exit 1
          fi
      # Only the wheels are offered to pip: it would read the other .tar.gz and .tgz files as sdists.
      - name: Test the wheel
        run: |
          set -euo pipefail
          expected="grimoire ${VERSION}"
          tmp="${RUNNER_TEMP}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            tmp="$(cygpath -m "${RUNNER_TEMP}")"
            python=python
            scripts="${tmp}/venv/Scripts"
            exe=.exe
          else
            python=python3
            scripts="${tmp}/venv/bin"
            exe=
          fi
          mkdir -p "${tmp}/wheels"
          cp dist/*.whl "${tmp}/wheels/"
          "${python}" -m venv "${tmp}/venv"
          "${scripts}/python${exe}" -m pip install --disable-pip-version-check --no-index --only-binary :all: --find-links "${tmp}/wheels" agent-grimoire
          actual="$("${scripts}/grimoire${exe}" --version)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::the wheel's grimoire printed '${actual}', expected '${expected}'"
            exit 1
          fi
      # winget is not part of the runner images (it is absent on windows-11-arm), so this runs
      # only where it happens to exist. Warnings fail it, as they fail winget-pkgs validation.
      - name: Validate the winget manifests (when winget is available)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Output '::notice::winget is not installed on this runner; skipped winget validate'
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP 'winget-manifest'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -Path 'dist/jabbott-iii.agent-grimoire*.yaml' -Destination $dir
          winget validate --manifest $dir --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed with exit code $LASTEXITCODE" }

  verify-linux:
    name: verify packages and manifests
    needs: [plan, package]
    runs-on: ubuntu-24.04
    # No id-token: `npm stage publish --dry-run` would otherwise try an OIDC token exchange.
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: "v0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      # Scoop v0.6.0 and winget-cli v1.29.380, whose schemas/JSON/manifests/latest/ is schema 1.28.0.
      SCOOP_COMMIT: "e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f"
      SCOOP_SCHEMA_SHA256: "64ec829c70758d3fba2c8c168a5901a64408a6493efda25f172b0fe4505caac0"
      WINGET_CLI_COMMIT: "000f6b55151cb0f1afd2933bb54c62a4724b9ca8"
      WINGET_VERSION_SCHEMA_SHA256: "5c9fa37ebe70dd410114157d31e4d9e84451b2bb8890e1c4345b4c690406ee1a"
      WINGET_INSTALLER_SCHEMA_SHA256: "2caa4cd3a630c284b5ef750522e2e5861f751f376180b89cd29873eb30504ef4"
      WINGET_DEFAULTLOCALE_SCHEMA_SHA256: "734c069c82470e3436d274fb381bfbe03e22f8fbfae2d2dd50df7dc055a3e061"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      # Before the downloads below, so the checkout is still clean. Interdependent crates that
      # are not on crates.io yet resolve from Cargo's local overlay.
      - name: Dry-run the crates.io publish
        run: cargo publish --workspace --dry-run --locked
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Download the winget JSON twins
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.work-artifact-id }}
          merge-multiple: true
          path: work/winget-json
      - name: Check the wheels with twine (hash-pinned)
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/twine"
          "${RUNNER_TEMP}/twine/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r .github/requirements/twine.txt
          "${RUNNER_TEMP}/twine/bin/twine" check --strict dist/*.whl
      # Unpacked outside the checkout, like every other downloaded tool.
      - name: Install ShellCheck (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/shellcheck"
          cd "${RUNNER_TEMP}/shellcheck"
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
      - name: Run ShellCheck on install.sh (rendered and template)
        run: '"${RUNNER_TEMP}/shellcheck/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --shell=sh dist/install.sh packaging/install/install.sh'
      # PowerShell 7 and PSScriptAnalyzer come with the runner image; the import fails unless 1.25.0 is there.
      - name: Run PSScriptAnalyzer on install.ps1 (rendered and template)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $loaded = @(Get-Module PSScriptAnalyzer)
          if ($loaded.Count -ne 1 -or $loaded[0].Version -ne [version]'1.25.0') {
            throw "expected PSScriptAnalyzer 1.25.0, loaded: $($loaded.Version -join ', ')"
          }
          $findings = @(
            foreach ($path in 'dist/install.ps1', 'packaging/install/install.ps1') {
              Invoke-ScriptAnalyzer -Path $path
            }
          )
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize -Wrap | Out-String -Width 4096 | Write-Output
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)"
          }
          Write-Output 'PSScriptAnalyzer: no findings'
      - name: Download the manifest schemas (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/schemas"
          cd "${RUNNER_TEMP}/schemas"
          curl -fsSLo scoop.schema.json "https://raw.githubusercontent.com/ScoopInstaller/Scoop/${SCOOP_COMMIT}/schema.json"
          for kind in version installer defaultLocale; do
            curl -fsSLo "winget.${kind}.schema.json" "https://raw.githubusercontent.com/microsoft/winget-cli/${WINGET_CLI_COMMIT}/schemas/JSON/manifests/latest/manifest.${kind}.latest.json"
          done
          echo "${SCOOP_SCHEMA_SHA256}  scoop.schema.json" | sha256sum -c -
          echo "${WINGET_VERSION_SCHEMA_SHA256}  winget.version.schema.json" | sha256sum -c -
          echo "${WINGET_INSTALLER_SCHEMA_SHA256}  winget.installer.schema.json" | sha256sum -c -
          echo "${WINGET_DEFAULTLOCALE_SCHEMA_SHA256}  winget.defaultLocale.schema.json" | sha256sum -c -
      # Test-Json checks JSON Schema only; winget validate (verify-install) adds winget's own rules.
      - name: Validate the Scoop and winget manifests against their schemas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $schemas = Join-Path $env:RUNNER_TEMP 'schemas'
          $pairs = [ordered]@{
            'dist/agent-grimoire.json' = 'scoop.schema.json'
            'work/winget-json/jabbott-iii.agent-grimoire.json' = 'winget.version.schema.json'
            'work/winget-json/jabbott-iii.agent-grimoire.installer.json' = 'winget.installer.schema.json'
            'work/winget-json/jabbott-iii.agent-grimoire.locale.en-US.json' = 'winget.defaultLocale.schema.json'
          }
          $twins = @(Get-ChildItem -Path 'work/winget-json' -File | ForEach-Object { "work/winget-json/$($_.Name)" })
          $unexpected = @($twins | Where-Object { -not $pairs.Contains($_) })
          if ($unexpected.Count -gt 0) { throw "no schema for: $($unexpected -join ', ')" }
          $failed = 0
          foreach ($document in $pairs.Keys) {
            $schema = Join-Path $schemas $pairs[$document]
            $valid = Test-Json -Path $document -SchemaFile $schema -ErrorAction SilentlyContinue -ErrorVariable problems
            if ($valid) {
              Write-Output "${document}: valid against $($pairs[$document])"
            } else {
              $failed++
              # Test-Json reports errors from the top two levels of its results only.
              if ($problems.Count -eq 0) {
                Write-Output "::error file=${document}::not valid against $($pairs[$document]) (Test-Json gave no detail)"
              }
              foreach ($problem in $problems) { Write-Output "::error file=${document}::$problem" }
            }
          }
          if ($failed -gt 0) { throw "$failed manifest(s) failed schema validation" }
      # `brew audit` refuses file paths, so the formula goes into a local tap that is then trusted.
      # No --new or --online: they fetch the release URLs, which don't exist before a release.
      - name: Audit the Homebrew formula in a trusted local tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          set -euo pipefail
          # Homebrew is preinstalled on ubuntu-24.04 but not on PATH.
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew --version
          brew tap-new --no-git local/grimoire-ci
          tap="$(brew --repository local/grimoire-ci)"
          cp dist/agent-grimoire.rb "${tap}/Formula/agent-grimoire.rb"
          brew trust --tap local/grimoire-ci
          brew style local/grimoire-ci/agent-grimoire
          brew audit --strict --formula --os=all --arch=all local/grimoire-ci/agent-grimoire
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Check the npm version
        run: |
          set -euo pipefail
          actual="$(npm --version)"
          if [ "${actual}" != "${NPM_VERSION}" ]; then
            echo "::error::expected npm ${NPM_VERSION}, found ${actual}"
            exit 1
          fi
      # Without credentials npm only warns that a real publish would need a login.
      # On pull requests the registry is an unreachable local address: npm then sees no
      # published versions, so a PR between releases (whose version is already on npm)
      # still exercises the publish checks, offline. --force is avoided on purpose: it would
      # also skip the prerelease-tag check. A release checks against the real registry.
      - name: Dry-run the npm publishes
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/*.tgz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "::error::no npm tarballs in dist"
            exit 1
          fi
          registry=()
          if [ "${MODE}" = "dry-run" ]; then
            registry=(--registry=http://127.0.0.1:9/ --fetch-retries=0)
          fi
          for tarball in "${tarballs[@]}"; do
            npm stage publish --dry-run --ignore-scripts --access public "${registry[@]}" "./${tarball}"
          done

  # Pull requests cannot use actions/attest (it has no dry-run and needs id-token), so the dry-run
  # signs and verifies every file offline: a throwaway key and a signing config with no services,
  # hence no Fulcio, Rekor, timestamp authority or TUF traffic.
  sign-dry-run:
    name: sign (dry-run, offline)
    needs: [plan, package, verify-install, verify-linux]
    if: needs.plan.outputs.mode == 'dry-run'
    runs-on: ubuntu-24.04
    # Only artifacts of this run are read, which needs no token permission.
    permissions: {}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Sign and verify every file with a throwaway key
        run: |
          set -euo pipefail
          dist="${PWD}/dist"
          work="${RUNNER_TEMP}/cosign-dry-run"
          mkdir -p "${work}/bundles"
          cd "${work}"
          # A random password for this job only; it is masked and never stored.
          COSIGN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::${COSIGN_PASSWORD}"
          export COSIGN_PASSWORD
          cosign generate-key-pair --output-key-prefix dryrun
          cosign signing-config create --out offline-signing-config.json
          count=0
          for file in "${dist}"/*; do
            name="$(basename "${file}")"
            cosign sign-blob --yes --key dryrun.key --signing-config offline-signing-config.json \
              --bundle "bundles/${name}.sigstore.json" "${file}"
            cosign verify-blob --key dryrun.pub --insecure-ignore-tlog \
              --bundle "bundles/${name}.sigstore.json" "${file}"
            count=$((count + 1))
          done
          echo "signed and verified ${count} files"
          # A changed file must fail verification.
          cp "${dist}/SHA256SUMS" tampered
          printf 'tampered' >> tampered
          if cosign verify-blob --key dryrun.pub --insecure-ignore-tlog --bundle bundles/SHA256SUMS.sigstore.json tampered; then
            echo "::error::cosign verified a tampered file"
            exit 1
          fi
          echo "cosign rejected a tampered file"

  attest:
    name: attest and sign (release)
    needs: [plan, package, verify-install, verify-linux]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # actions/attest and cosign get their Sigstore signing certificates with the job's OIDC token
      attestations: write # actions/attest stores the provenance attestation on this repository
    outputs:
      sigstore-artifact-id: ${{ steps.upload-sigstore.outputs.artifact-id }}
    env:
      COSIGN_IDENTITY: https://github.com/jabbott-iii/Grimoire/.github/workflows/release.yml@refs/heads/main
      COSIGN_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      # The artifact is the one the package job uploaded, unchanged, and holds nothing else.
      - name: Check the release assets
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums-sha256 }}
        run: |
          set -euo pipefail
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict --quiet -
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          expected="$( (cut -c 67- dist/SHA256SUMS; echo SHA256SUMS) | sort)"
          actual="$(cd dist && find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::dist/ does not hold exactly the files SHA256SUMS lists"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
      # One SLSA provenance attestation whose subjects are every file, SHA256SUMS included.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Keyless: the certificate names this workflow on refs/heads/main. Each bundle is checked at once.
      - name: Sign every file with cosign (keyless)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sigstore"
          for file in dist/*; do
            bundle="${RUNNER_TEMP}/sigstore/$(basename "${file}").sigstore.json"
            cosign sign-blob --yes --bundle "${bundle}" "${file}"
            cosign verify-blob --bundle "${bundle}" \
              --certificate-identity "${COSIGN_IDENTITY}" \
              --certificate-oidc-issuer "${COSIGN_ISSUER}" "${file}"
          done
      - name: Upload the cosign bundles
        id: upload-sigstore
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sigstore
          path: ${{ runner.temp }}/sigstore/
          if-no-files-found: error

  attest-sbom:
    name: attest SBOM (${{ matrix.archive }})
    needs: [plan, package, verify-install, verify-linux]
    if: needs.plan.outputs.mode == 'release'
    strategy:
      fail-fast: false
      matrix:
        archive: ${{ fromJSON(needs.plan.outputs.archives) }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # actions/attest gets its Sigstore signing certificate with the job's OIDC token
      attestations: write # actions/attest stores the SBOM attestation on this repository
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      # The artifact is the one the package job uploaded, unchanged, and holds nothing else.
      - name: Check the release assets
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums-sha256 }}
        run: |
          set -euo pipefail
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict --quiet -
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          expected="$( (cut -c 67- dist/SHA256SUMS; echo SHA256SUMS) | sort)"
          actual="$(cd dist && find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::dist/ does not hold exactly the files SHA256SUMS lists"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
      - name: Attest the archive's CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ matrix.archive }}
          sbom-path: dist/${{ matrix.archive }}.cdx.json

  # Publishing, in four jobs with four environments (the maintainer's choice, ADR-0009): each
  # registry's trusted publisher accepts only its own environment, so code in one job (the PyPI
  # action's container, say) can never get a token for another registry.
  #   publish (release): verify everything, then the tag and the GitHub Release, which install.sh,
  #     install.ps1, Homebrew, Scoop and winget download from. No OIDC.
  #   publish-crates (crates-io), publish-npm (npm), publish-pypi (pypi): after it, approved together.
  # Every step skips what is already done, so "Re-run failed jobs" on this run finishes a partial
  # release (see docs/release.md for staged npm versions). A new run would see the tag and plan `skip`.
  # Only release mode names the environments: a run that names a missing environment creates it
  # without protection rules.
  publish:
    name: publish GitHub Release (release)
    needs: [plan, package, attest, attest-sbom]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.plan.outputs.mode == 'release' && 'release' || '' }}
    permissions:
      contents: write # create the tag and the GitHub Release, and upload the release assets
      attestations: read # gh attestation verify reads this repository's attestations
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      # The repository every `gh release` command acts on.
      GH_REPO: ${{ github.repository }}
      COSIGN_IDENTITY: https://github.com/jabbott-iii/Grimoire/.github/workflows/release.yml@refs/heads/main
      COSIGN_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Download the cosign bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.attest.outputs.sigstore-artifact-id }}
          merge-multiple: true
          path: dist
      # The artifact is the one the package job uploaded, unchanged, and holds nothing else.
      - name: Check the release assets
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums-sha256 }}
        run: |
          set -euo pipefail
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict --quiet -
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          expected="$( (cut -c 67- dist/SHA256SUMS; echo SHA256SUMS) | sort)"
          actual="$(cd dist && find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::dist/ does not hold exactly the files SHA256SUMS lists"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify SHA256SUMS
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::unexpected tag '${TAG}' for version '${VERSION}'"
            exit 1
          fi
          cargo --locked xtask release checksums --dist dist --check
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Verify every cosign bundle
        run: |
          set -euo pipefail
          for file in dist/*; do
            case "${file}" in *.sigstore.json) continue ;; esac
            if [ ! -f "${file}.sigstore.json" ]; then
              echo "::error::no cosign bundle for ${file}"
              exit 1
            fi
            cosign verify-blob --bundle "${file}.sigstore.json" \
              --certificate-identity "${COSIGN_IDENTITY}" \
              --certificate-oidc-issuer "${COSIGN_ISSUER}" "${file}"
          done
          for bundle in dist/*.sigstore.json; do
            if [ ! -f "${bundle%.sigstore.json}" ]; then
              echo "::error::${bundle} signs no release file"
              exit 1
            fi
          done
      - name: Verify the build provenance of SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh_version="$(gh --version | sed -n 's/^gh version \([0-9][0-9.]*\).*/\1/p')"
          if [ "$(printf '%s\n' 2.102.0 "${gh_version}" | sort -V | head -n 1)" != "2.102.0" ]; then
            echo "::error::gh ${gh_version} is older than 2.102.0"
            exit 1
          fi
          gh attestation verify dist/SHA256SUMS \
            --repo jabbott-iii/Grimoire \
            --signer-workflow jabbott-iii/Grimoire/.github/workflows/release.yml \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          err="${RUNNER_TEMP}/tag.err"
          if ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>"${err}")"; then
            type="$(jq -r '.object.type' <<<"${ref}")"
            sha="$(jq -r '.object.sha' <<<"${ref}")"
            if [ "${type}" = "tag" ]; then
              sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
            fi
            if [ "${sha}" != "${GITHUB_SHA}" ]; then
              echo "::error::tag ${TAG} already points at ${sha}, not at ${GITHUB_SHA}"
              exit 1
            fi
            echo "tag ${TAG} already points at ${GITHUB_SHA}"
          elif grep -q 'HTTP 404' "${err}"; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
            echo "created tag ${TAG} at ${GITHUB_SHA}"
          else
            cat "${err}" >&2
            exit 1
          fi
      - name: Write the release notes
        run: cargo --locked xtask release notes --version "${VERSION}" --out "${RUNNER_TEMP}/release-notes.md"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          err="${RUNNER_TEMP}/release.err"
          if release="$(gh release view "${TAG}" --json isDraft,assets 2>"${err}")"; then
            state="$(jq -r 'if .isDraft then "draft" else "published" end' <<<"${release}")"
          elif grep -q 'release not found' "${err}"; then
            state=missing
          else
            cat "${err}" >&2
            exit 1
          fi
          echo "release ${TAG}: ${state}"
          if [ "${state}" = "missing" ]; then
            gh release create "${TAG}" --draft --verify-tag --title "${TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
            state=draft
          fi
          if [ "${state}" = "draft" ]; then
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --draft=false
          else
            expected="$(cd dist && for f in *; do printf '%s sha256:%s\n' "${f}" "$(sha256sum "${f}" | cut -d ' ' -f 1)"; done | sort)"
            actual="$(jq -r '.assets[] | "\(.name) \(.digest)"' <<<"${release}" | sort)"
            if [ "${expected}" != "${actual}" ]; then
              echo "::error::published release ${TAG} does not hold exactly the files in dist"
              diff <(echo "${expected}") <(echo "${actual}") || true
              exit 1
            fi
            echo "published release ${TAG} already holds exactly the files in dist"
          fi
          immutable="$(gh release view "${TAG}" --json isImmutable --jq '.isImmutable')"
          echo "release ${TAG} immutable: ${immutable}"
          if [ "${immutable}" != "true" ]; then
            echo "::warning::release ${TAG} is not immutable; enable release immutability in the repository settings"
          fi

  # crates.io: only versions not yet published. The token step and the publish step are
  # skipped when nothing is pending, so CARGO_REGISTRY_TOKEN is never set to an empty value.
  publish-crates:
    name: publish to crates.io (release)
    needs: [plan, publish]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.plan.outputs.mode == 'release' && 'crates-io' || '' }}
    permissions:
      contents: read
      id-token: write # trusted publishing: an OIDC token for crates.io, bound to environment crates-io
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Find the crates not yet on crates.io
        id: crates
        env:
          CRATES: ${{ needs.plan.outputs.crates }}
          USER_AGENT: agent-grimoire-release (+https://github.com/jabbott-iii/Grimoire)
        run: |
          set -euo pipefail
          mapfile -t names < <(jq -r '.[]' <<<"${CRATES}")
          pending=()
          for name in "${names[@]}"; do
            if ! [[ "${name}" =~ ^[a-z0-9_-]+$ ]]; then
              echo "::error::unexpected crate name '${name}'"
              exit 1
            fi
            code="$(curl -sS --retry 3 -A "${USER_AGENT}" -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/${name}/${VERSION}")"
            case "${code}" in
              200) echo "${name} ${VERSION} is already on crates.io" ;;
              404) pending+=("${name}") ;;
              *)
                echo "::error::crates.io answered HTTP ${code} for ${name} ${VERSION}"
                exit 1
                ;;
            esac
          done
          echo "pending: ${pending[*]:-none}"
          echo "pending=${pending[*]}" >> "${GITHUB_OUTPUT}"
      - name: Get a crates.io token (trusted publishing)
        id: crates-io-auth
        if: steps.crates.outputs.pending != ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crates
        if: steps.crates.outputs.pending != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          PENDING: ${{ steps.crates.outputs.pending }}
        run: |
          set -euo pipefail
          read -r -a names <<<"${PENDING}"
          packages=()
          for name in "${names[@]}"; do packages+=(-p "${name}"); done
          cargo publish --locked "${packages[@]}"

  publish-npm:
    name: stage on npm (release)
    needs: [plan, package, publish]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.plan.outputs.mode == 'release' && 'npm' || '' }}
    permissions:
      id-token: write # trusted publishing: an OIDC token for npm, bound to environment npm
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      # The artifact is the one the package job uploaded, unchanged, and holds nothing else.
      - name: Check the release assets
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums-sha256 }}
        run: |
          set -euo pipefail
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict --quiet -
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          expected="$( (cut -c 67- dist/SHA256SUMS; echo SHA256SUMS) | sort)"
          actual="$(cd dist && find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::dist/ does not hold exactly the files SHA256SUMS lists"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Check the npm version
        run: |
          set -euo pipefail
          actual="$(npm --version)"
          if [ "${actual}" != "${NPM_VERSION}" ]; then
            echo "::error::expected npm ${NPM_VERSION}, found ${actual}"
            exit 1
          fi
      - name: Stage the npm packages
        run: |
          set -euo pipefail
          on_registry() {
            local out
            if out="$(npm view "$1@$2" version 2>"${RUNNER_TEMP}/npm-view.err")"; then
              [ -n "${out}" ]
              return
            fi
            if grep -q E404 "${RUNNER_TEMP}/npm-view.err"; then return 1; fi
            cat "${RUNNER_TEMP}/npm-view.err" >&2
            echo "::error::npm view $1@$2 failed"
            exit 1
          }
          # A staged version isn't public yet, so `npm view` can't see it, and npm refuses to
          # stage the same version twice. Approve or reject the earlier stage first.
          stage() {
            if on_registry "$1" "${VERSION}"; then
              echo "$1@${VERSION} is already on the registry"
            elif ! npm stage publish --access public --ignore-scripts "./$2"; then
              echo "::error::npm refused to stage $1@${VERSION}. If an earlier run staged it, approve or reject that version under Staged Packages on npmjs.com, then re-run this job."
              exit 1
            fi
          }
          launcher=""
          platforms=()
          for tarball in dist/*.tgz; do
            manifest="$(tar -xzOf "${tarball}" package/package.json)"
            name="$(jq -r '.name' <<<"${manifest}")"
            version="$(jq -r '.version' <<<"${manifest}")"
            if [ "${version}" != "${VERSION}" ]; then
              echo "::error::${tarball} is version ${version}, expected ${VERSION}"
              exit 1
            fi
            case "${name}" in
              agent-grimoire) launcher="${tarball}" ;;
              @agent-grimoire/*) platforms+=("${name}=${tarball}") ;;
              *)
                echo "::error::${tarball} holds unexpected package ${name}"
                exit 1
                ;;
            esac
          done
          if [ -z "${launcher}" ] || [ "${#platforms[@]}" -ne 6 ]; then
            echo "::error::expected the launcher and six platform tarballs in dist"
            exit 1
          fi
          for entry in "${platforms[@]}"; do
            stage "${entry%%=*}" "${entry#*=}"
          done
          stage agent-grimoire "${launcher}"

  # The PyPI action runs a container image referenced by tag, not digest (ADR-0009), so this
  # job holds nothing but the wheels and a token only PyPI accepts.
  publish-pypi:
    name: publish to PyPI (release)
    needs: [plan, package, publish]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.plan.outputs.mode == 'release' && 'pypi' || '' }}
    permissions:
      id-token: write # trusted publishing: an OIDC token for PyPI, bound to environment pypi
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      # The artifact is the one the package job uploaded, unchanged, and holds nothing else.
      - name: Check the release assets
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums-sha256 }}
        run: |
          set -euo pipefail
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict --quiet -
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          expected="$( (cut -c 67- dist/SHA256SUMS; echo SHA256SUMS) | sort)"
          actual="$(cd dist && find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::dist/ does not hold exactly the files SHA256SUMS lists"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
      - name: Collect the wheels
        run: |
          set -euo pipefail
          mkdir -p pypi-dist
          cp dist/*.whl pypi-dist/
      - name: Publish the wheels to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-dist/
          skip-existing: true

  # One stable check for the ruleset to require: it fails when any check above failed or was
  # cancelled, and on pull requests also when one was skipped. A required check whose job is
  # skipped would otherwise count as passed.
  release-checks:
    name: release checks
    needs: [plan, build, package, verify-install, verify-linux, sign-dry-run]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every check to pass
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${RESULTS}"
          if [ "${MODE}" = "dry-run" ]; then
            bad="$(jq '[.[] | select(.result != "success")] | length' <<<"${RESULTS}")"
          else
            # Release and skip runs skip some of these jobs by design.
            bad="$(jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length' <<<"${RESULTS}")"
          fi
          if [ -z "${MODE}" ] || [ "${bad}" -ne 0 ]; then
            echo "::error::release checks failed (mode '${MODE}')"
            exit 1
          fi
