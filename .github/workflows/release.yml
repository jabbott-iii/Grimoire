# The release pipeline: a dry-run on every pull request and push, and the real release
# from main once the maintainer turns it on (repository variable GRIMOIRE_RELEASES=enabled).
#
#   plan -> build (matrix) -> package -> verify-install (matrix) + verify-linux
#                                     -> image -> verify-image (matrix; dry-run: offline cosign)
#     dry-run: -> sign-dry-run (cosign, throwaway key, offline)
#     release: -> sign-files (sign.yml) -> publish (environment `release`)
#              -> publish-crates (`crates-io`) + publish-npm (`npm`) + publish-pypi (`pypi`)
#                 + publish-image (`ghcr`) -> sign-image (sign.yml)
#   Every signature and attestation is made in sign.yml, whose certificates no job here can get.
#   release-checks: one stable result for the ruleset to require.
#
# `cargo --locked xtask release` holds the logic (ADR-0009); this file is glue. Every channel ships
# the same signed bytes: the archives built here, and the npm packages and wheels made from them.
#
# Hardening rules (zizmor pedantic), as in ci.yml: permissions {} at the top with minimal per-job
# grants, full-SHA pins with version comments, persist-credentials: false, no ${{ }} in run:
# steps, no caches anywhere. Action SHAs and tool checksums were verified on 2026-11-17, and every
# pinned action or tool was a release at least 7 days old when adopted (the Dependabot cooldown).
name: Release

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# Pull requests cancel superseded runs. Runs on main queue instead, so a release is never cut off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # actions/setup-node installs this Node.js, which bundles npm 11.19.1. Every job that packs or
  # publishes npm packages asserts that npm version: staged publishing needs npm >= 11.15.0.
  NODE_VERSION: "24.22.3"
  NPM_VERSION: "11.19.1"
  # The container image (ADR-0011). The name is written out in lowercase: an OCI repository
  # name must be, and github.repository (jabbott-iii/Grimoire) is not (REGISTRY-P6).
  IMAGE: ghcr.io/jabbott-iii/grimoire
  # Image tools, each a release at least 7 days old, checked against the SHA-256 its release
  # publishes (BUILD-P6, REGISTRY-P6, SCAN-P6). Dependabot can't see these: bump them by hand.
  BUILDX_VERSION: "0.38.2"
  BUILDX_SHA256: "7992ec09413b80ff57ba4e081f56fc833d7bac1d5e71143c6c809e7e6065f6d6"
  CRANE_VERSION: "0.22.1"
  CRANE_SHA256_X64: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
  CRANE_SHA256_ARM64: "898c0cff975f898a33e8c4580bdafb0e7c02c7faa33374e946762f97c4ab7110"
  GRYPE_VERSION: "0.121.3"
  GRYPE_SHA256: "e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85"
  # The images BuildKit runs, pinned by digest (BUILD-P6): the builder, and the SBOM scanner,
  # which BuildKit would otherwise pull by its `stable-1` tag on every build.
  BUILDKIT_IMAGE: "moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe"
  SBOM_SCANNER_IMAGE: "docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315"
  # distroless's keyless signing identity (BASE-IMAGE-P6).
  DISTROLESS_IDENTITY: keyless@distroless.iam.gserviceaccount.com
  DISTROLESS_ISSUER: https://accounts.google.com

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      targets: ${{ steps.plan.outputs.targets }}
      crates: ${{ steps.plan.outputs.crates }}
      archives: ${{ steps.plan.outputs.archives }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      # mode is `dry-run` unless this is a push or manual run on main with releases enabled;
      # then `release`, or `skip` when tag v{version} already exists on origin.
      - name: Plan the run
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GRIMOIRE_RELEASES: ${{ vars.GRIMOIRE_RELEASES }}
        run: >-
          cargo --locked xtask release plan
          --event "${EVENT_NAME}"
          --ref "${GITHUB_REF}"
          --releases-enabled "${GRIMOIRE_RELEASES}"
          --github-output "${GITHUB_OUTPUT}"

  build:
    name: build (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and the target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "${TARGET}"
      - name: Install cargo-auditable
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-auditable@0.7.7
          # Fail rather than fall back to an unverified cargo-binstall download.
          fallback: none
      # Builds natively, runs each binary with --version and writes the flat, reproducible archives.
      - name: Build and archive
        env:
          TARGET: ${{ matrix.target }}
        run: cargo --locked xtask release build --target "${TARGET}" --out dist
      - name: Upload the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  package:
    name: package channels and checksums
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Later jobs download these artifacts by ID and check SHA256SUMS against this hash, so a
    # same-named artifact uploaded by another job of the run is never what gets signed.
    outputs:
      dist-artifact-id: ${{ steps.upload-dist.outputs.artifact-id }}
      work-artifact-id: ${{ steps.upload-work.outputs.artifact-id }}
      sums-sha256: ${{ steps.sums.outputs.sha256 }}
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      # Checked against the release's own sha256.sum.
      CYCLONEDX_VERSION: "0.5.10"
      CYCLONEDX_SHA256: "528be9dd99ae522c3ee14fb881fd0cbf51767e8f12b74248f437e6a66b1a3c1b"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      # Unpacked outside the checkout. dist-built tarballs hold one top-level directory.
      - name: Install cargo-cyclonedx (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cargo-cyclonedx"
          cd "${RUNNER_TEMP}/cargo-cyclonedx"
          curl -fsSLo cargo-cyclonedx.tar.xz "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CYCLONEDX_VERSION}/cargo-cyclonedx-x86_64-unknown-linux-musl.tar.xz"
          echo "${CYCLONEDX_SHA256}  cargo-cyclonedx.tar.xz" | sha256sum -c -
          tar -xJf cargo-cyclonedx.tar.xz cargo-cyclonedx-x86_64-unknown-linux-musl/cargo-cyclonedx
          echo "${RUNNER_TEMP}/cargo-cyclonedx/cargo-cyclonedx-x86_64-unknown-linux-musl" >> "${GITHUB_PATH}"
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Check the npm version
        run: |
          set -euo pipefail
          actual="$(npm --version)"
          if [ "${actual}" != "${NPM_VERSION}" ]; then
            echo "::error::expected npm ${NPM_VERSION}, found ${actual}"
            exit 1
          fi
      # Archive names are unique per target, so merging the artifacts cannot collide.
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: Write the SBOMs
        run: cargo --locked xtask release sbom --dist dist
      # Pull request dry-runs build only some of the six targets (targets.rs), so the channels are generated --partial.
      - name: Generate the channel files
        run: |
          set -euo pipefail
          partial=()
          if [ "${MODE}" = "dry-run" ]; then partial=(--partial); fi
          cargo --locked xtask release channels --dist dist --work work "${partial[@]}"
      - name: Pack the npm packages
        run: |
          set -euo pipefail
          for pkg in work/npm/*/; do
            npm pack --ignore-scripts --pack-destination dist "./${pkg%/}"
          done
      - name: Write SHA256SUMS
        run: cargo --locked xtask release checksums --dist dist
      - name: Verify the release assets
        run: |
          set -euo pipefail
          partial=()
          if [ "${MODE}" = "dry-run" ]; then partial=(--partial); fi
          cargo --locked xtask release verify --dist dist "${partial[@]}"
      - name: Record the SHA-256 of SHA256SUMS
        id: sums
        run: echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
      - name: Upload the release assets
        id: upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
      # JSON twins of the winget manifests, for schema validation in verify-linux.
      - name: Upload the winget JSON twins
        id: upload-work
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-work
          path: work/winget-json/
          if-no-files-found: error

  verify-install:
    name: verify install (${{ matrix.target }})
    needs: [plan, package]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    # Only artifacts of this run are read, which needs no token permission.
    permissions: {}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
      # The winget-cli release installed on Windows, below.
      WINGET_CLI_VERSION: "v1.29.380"
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      # The good server serves dist/; the other serves this target's archive with bytes appended.
      # The rendered install.sh must install the right binary from the first and refuse the second.
      - name: Test install.sh against a local server
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          expected="grimoire ${VERSION}"
          archive="agent-grimoire-${VERSION}-${TARGET}.tar.gz"
          pids=()
          trap 'kill "${pids[@]}" 2>/dev/null || true' EXIT
          serve() {
            python3 -m http.server --bind 127.0.0.1 --directory "$1" "$2" >"${RUNNER_TEMP}/http-$2.log" 2>&1 &
            pids+=("$!")
            for _ in $(seq 1 30); do
              if curl -fs -o /dev/null "http://127.0.0.1:$2/SHA256SUMS"; then return 0; fi
              sleep 1
            done
            cat "${RUNNER_TEMP}/http-$2.log"
            echo "::error::the test server on port $2 did not start"
            return 1
          }
          tampered="${RUNNER_TEMP}/tampered"
          mkdir -p "${tampered}" "${RUNNER_TEMP}/expected"
          cp dist/SHA256SUMS "dist/${archive}" "${tampered}/"
          printf 'tampered' >> "${tampered}/${archive}"
          tar -xzf "dist/${archive}" -C "${RUNNER_TEMP}/expected" grimoire
          serve dist 8765
          serve "${tampered}" 8766

          dir="${RUNNER_TEMP}/install-sh/bin"
          GRIMOIRE_DOWNLOAD_URL="http://127.0.0.1:8765" sh dist/install.sh --to "${dir}"
          actual="$("${dir}/grimoire" --version)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::install.sh installed a grimoire that prints '${actual}', expected '${expected}'"
            exit 1
          fi
          if ! cmp "${dir}/grimoire" "${RUNNER_TEMP}/expected/grimoire"; then
            echo "::error::install.sh did not install the ${TARGET} binary"
            exit 1
          fi

          bad="${RUNNER_TEMP}/install-sh-tampered/bin"
          if GRIMOIRE_DOWNLOAD_URL="http://127.0.0.1:8766" sh dist/install.sh --to "${bad}"; then
            echo "::error::install.sh accepted a tampered archive"
            exit 1
          fi
          if [ -e "${bad}/grimoire" ]; then
            echo "::error::install.sh left a binary behind after rejecting a tampered archive"
            exit 1
          fi
          echo "install.sh rejected the tampered archive"
      # The same checks for install.ps1, under PowerShell 7 (pwsh) and Windows PowerShell 5.1.
      # -ExecutionPolicy Bypass applies to that one process only.
      - name: Test install.ps1 against a local server (pwsh and Windows PowerShell)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          expected="grimoire ${VERSION}"
          archive="agent-grimoire-${VERSION}-${TARGET}.zip"
          tmp="$(cygpath -m "${RUNNER_TEMP}")"
          pids=()
          trap 'kill "${pids[@]}" 2>/dev/null || true' EXIT
          serve() {
            python -m http.server --bind 127.0.0.1 --directory "$1" "$2" >"${tmp}/http-$2.log" 2>&1 &
            pids+=("$!")
            for _ in $(seq 1 30); do
              if curl -fs -o /dev/null "http://127.0.0.1:$2/SHA256SUMS"; then return 0; fi
              sleep 1
            done
            cat "${tmp}/http-$2.log"
            echo "::error::the test server on port $2 did not start"
            return 1
          }
          tampered="${tmp}/tampered"
          mkdir -p "${tampered}"
          cp dist/SHA256SUMS "dist/${archive}" "${tampered}/"
          printf 'tampered' >> "${tampered}/${archive}"
          python -m zipfile -e "dist/${archive}" "${tmp}/expected"
          serve dist 8765
          serve "${tampered}" 8766

          for shell in pwsh powershell; do
            dir="${tmp}/install-ps1-${shell}"
            GRIMOIRE_DOWNLOAD_URL="http://127.0.0.1:8765" "${shell}" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File dist/install.ps1 -InstallDir "${dir}"
            actual="$("${dir}/grimoire.exe" --version)"
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::install.ps1 (${shell}) installed a grimoire that prints '${actual}', expected '${expected}'"
              exit 1
            fi
            if ! cmp "${dir}/grimoire.exe" "${tmp}/expected/grimoire.exe"; then
              echo "::error::install.ps1 (${shell}) did not install the ${TARGET} binary"
              exit 1
            fi

            bad="${tmp}/install-ps1-${shell}-tampered"
            if GRIMOIRE_DOWNLOAD_URL="http://127.0.0.1:8766" "${shell}" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File dist/install.ps1 -InstallDir "${bad}"; then
              echo "::error::install.ps1 (${shell}) accepted a tampered archive"
              exit 1
            fi
            if [ -e "${bad}/grimoire.exe" ]; then
              echo "::error::install.ps1 (${shell}) left a binary behind after rejecting a tampered archive"
              exit 1
            fi
            echo "install.ps1 (${shell}) rejected the tampered archive"
          done
      # A throwaway project that depends on the two local tarballs. The launcher's other optional
      # dependencies are not on the registry yet; npm skips optional dependencies it cannot fetch.
      - name: Test the npm packages
        run: |
          set -euo pipefail
          case "${TARGET}" in
            x86_64-unknown-linux-musl) platform=linux-x64 ;;
            aarch64-unknown-linux-musl) platform=linux-arm64 ;;
            x86_64-apple-darwin) platform=darwin-x64 ;;
            aarch64-apple-darwin) platform=darwin-arm64 ;;
            x86_64-pc-windows-msvc) platform=win32-x64 ;;
            aarch64-pc-windows-msvc) platform=win32-arm64 ;;
            *) echo "::error::no npm package for ${TARGET}"; exit 1 ;;
          esac
          expected="grimoire ${VERSION}"
          project="${RUNNER_TEMP}/npm-project"
          if [ "${RUNNER_OS}" = "Windows" ]; then project="$(cygpath -m "${project}")"; fi
          mkdir -p "${project}"
          cp "dist/agent-grimoire-${platform}-${VERSION}.tgz" "dist/agent-grimoire-${VERSION}.tgz" "${project}/"
          cd "${project}"
          cat > package.json <<EOF
          {
            "private": true,
            "dependencies": {
              "@agent-grimoire/${platform}": "file:./agent-grimoire-${platform}-${VERSION}.tgz",
              "agent-grimoire": "file:./agent-grimoire-${VERSION}.tgz"
            }
          }
          EOF
          npm install --ignore-scripts --no-audit --no-fund
          actual="$(npx --no-install grimoire --version)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::the npm launcher printed '${actual}', expected '${expected}'"
            exit 1
          fi
      # Only the wheels are offered to pip: it would read the other .tar.gz and .tgz files as sdists.
      - name: Test the wheel
        run: |
          set -euo pipefail
          expected="grimoire ${VERSION}"
          tmp="${RUNNER_TEMP}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            tmp="$(cygpath -m "${RUNNER_TEMP}")"
            python=python
            scripts="${tmp}/venv/Scripts"
            exe=.exe
          else
            python=python3
            scripts="${tmp}/venv/bin"
            exe=
          fi
          mkdir -p "${tmp}/wheels"
          cp dist/*.whl "${tmp}/wheels/"
          "${python}" -m venv "${tmp}/venv"
          "${scripts}/python${exe}" -m pip install --disable-pip-version-check --no-index --only-binary :all: --find-links "${tmp}/wheels" agent-grimoire
          actual="$("${scripts}/grimoire${exe}" --version)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::the wheel's grimoire printed '${actual}', expected '${expected}'"
            exit 1
          fi
      # The runner's own winget predates schema 1.28.0 (first in winget-cli v1.28.190). It checks
      # the manifests against its older built-in schema and warns on every 1.28.0 header, so install
      # the winget-cli release whose schemas verify-linux pins (WINGET_CLI_COMMIT is its tag's
      # commit). Bump them and the job's WINGET_CLI_VERSION by hand, together with WINGET_CLI_COMMIT:
      # Dependabot can't see them.
      # Windows PowerShell, not pwsh: Add-AppxPackage comes from its Appx module.
      - name: Install the pinned winget
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: powershell
        env:
          WINGET_BUNDLE_SHA256: "65dea9c01ce08ee7b763366b27c0e651f97db857c11ca9b9c301826c10092f2e"
          WINGET_DEPENDENCIES_SHA256: "ba875afe9d190f61218985ac0292a99d1db710bf93e13c68944ca9d89f0d82d1"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dir = Join-Path $env:RUNNER_TEMP 'winget-cli'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = "https://github.com/microsoft/winget-cli/releases/download/$env:WINGET_CLI_VERSION"
          $files = [ordered]@{
            'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle' = $env:WINGET_BUNDLE_SHA256
            'DesktopAppInstaller_Dependencies.zip' = $env:WINGET_DEPENDENCIES_SHA256
          }
          foreach ($name in $files.Keys) {
            $path = Join-Path $dir $name
            Invoke-WebRequest -UseBasicParsing -Uri "$base/$name" -OutFile $path
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
            if ($actual -ne $files[$name]) { throw "SHA-256 mismatch for ${name}: expected $($files[$name]), got $actual" }
          }
          $bundle = Join-Path $dir 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle'
          Expand-Archive -LiteralPath (Join-Path $dir 'DesktopAppInstaller_Dependencies.zip') -DestinationPath (Join-Path $dir 'deps')
          $appx = @(Get-ChildItem -LiteralPath (Join-Path $dir 'deps\x64') -Filter '*.appx' | ForEach-Object { $_.FullName })
          if ($appx.Count -ne 3) { throw "expected 3 x64 dependency packages, found $($appx.Count)" }
          Add-AppxPackage -Path $bundle -DependencyPath $appx -ForceApplicationShutdown
      # Warnings fail it, as they fail winget-pkgs validation.
      - name: Validate the winget manifests
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (winget --version | Out-String).Trim()
          if ($version -ne $env:WINGET_CLI_VERSION) {
            throw "winget reports '$version', expected '$env:WINGET_CLI_VERSION'"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'winget-manifest'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -Path 'dist/jabbott-iii.agent-grimoire*.yaml' -Destination $dir
          winget validate --manifest $dir --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed with exit code $LASTEXITCODE" }

  verify-linux:
    name: verify packages and manifests
    needs: [plan, package]
    runs-on: ubuntu-24.04
    # No id-token: `npm stage publish --dry-run` would otherwise try an OIDC token exchange.
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: "v0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      # Scoop v0.6.0 and winget-cli v1.29.380, whose schemas/JSON/manifests/latest/ is schema 1.28.0.
      SCOOP_COMMIT: "e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f"
      SCOOP_SCHEMA_SHA256: "64ec829c70758d3fba2c8c168a5901a64408a6493efda25f172b0fe4505caac0"
      WINGET_CLI_COMMIT: "000f6b55151cb0f1afd2933bb54c62a4724b9ca8"
      WINGET_VERSION_SCHEMA_SHA256: "5c9fa37ebe70dd410114157d31e4d9e84451b2bb8890e1c4345b4c690406ee1a"
      WINGET_INSTALLER_SCHEMA_SHA256: "2caa4cd3a630c284b5ef750522e2e5861f751f376180b89cd29873eb30504ef4"
      WINGET_DEFAULTLOCALE_SCHEMA_SHA256: "734c069c82470e3436d274fb381bfbe03e22f8fbfae2d2dd50df7dc055a3e061"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      # Before the downloads below, so the checkout is still clean. Interdependent crates that
      # are not on crates.io yet resolve from Cargo's local overlay.
      - name: Dry-run the crates.io publish
        run: cargo publish --workspace --dry-run --locked
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Download the winget JSON twins
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.work-artifact-id }}
          merge-multiple: true
          path: work/winget-json
      - name: Check the wheels with twine (hash-pinned)
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/twine"
          "${RUNNER_TEMP}/twine/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r .github/requirements/twine.txt
          "${RUNNER_TEMP}/twine/bin/twine" check --strict dist/*.whl
      # Unpacked outside the checkout, like every other downloaded tool.
      - name: Install ShellCheck (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/shellcheck"
          cd "${RUNNER_TEMP}/shellcheck"
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
      - name: Run ShellCheck on install.sh (rendered and template)
        run: '"${RUNNER_TEMP}/shellcheck/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --shell=sh dist/install.sh packaging/install/install.sh'
      # PowerShell 7 and PSScriptAnalyzer come with the runner image; the import fails unless 1.25.0 is there.
      - name: Run PSScriptAnalyzer on install.ps1 (rendered and template)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $loaded = @(Get-Module PSScriptAnalyzer)
          if ($loaded.Count -ne 1 -or $loaded[0].Version -ne [version]'1.25.0') {
            throw "expected PSScriptAnalyzer 1.25.0, loaded: $($loaded.Version -join ', ')"
          }
          $findings = @(
            foreach ($path in 'dist/install.ps1', 'packaging/install/install.ps1') {
              Invoke-ScriptAnalyzer -Path $path
            }
          )
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize -Wrap | Out-String -Width 4096 | Write-Output
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)"
          }
          Write-Output 'PSScriptAnalyzer: no findings'
      - name: Download the manifest schemas (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/schemas"
          cd "${RUNNER_TEMP}/schemas"
          curl -fsSLo scoop.schema.json "https://raw.githubusercontent.com/ScoopInstaller/Scoop/${SCOOP_COMMIT}/schema.json"
          for kind in version installer defaultLocale; do
            curl -fsSLo "winget.${kind}.schema.json" "https://raw.githubusercontent.com/microsoft/winget-cli/${WINGET_CLI_COMMIT}/schemas/JSON/manifests/latest/manifest.${kind}.latest.json"
          done
          echo "${SCOOP_SCHEMA_SHA256}  scoop.schema.json" | sha256sum -c -
          echo "${WINGET_VERSION_SCHEMA_SHA256}  winget.version.schema.json" | sha256sum -c -
          echo "${WINGET_INSTALLER_SCHEMA_SHA256}  winget.installer.schema.json" | sha256sum -c -
          echo "${WINGET_DEFAULTLOCALE_SCHEMA_SHA256}  winget.defaultLocale.schema.json" | sha256sum -c -
      # Test-Json checks JSON Schema only; winget validate (verify-install) adds winget's own rules.
      - name: Validate the Scoop and winget manifests against their schemas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $schemas = Join-Path $env:RUNNER_TEMP 'schemas'
          $pairs = [ordered]@{
            'dist/agent-grimoire.json' = 'scoop.schema.json'
            'work/winget-json/jabbott-iii.agent-grimoire.json' = 'winget.version.schema.json'
            'work/winget-json/jabbott-iii.agent-grimoire.installer.json' = 'winget.installer.schema.json'
            'work/winget-json/jabbott-iii.agent-grimoire.locale.en-US.json' = 'winget.defaultLocale.schema.json'
          }
          $twins = @(Get-ChildItem -Path 'work/winget-json' -File | ForEach-Object { "work/winget-json/$($_.Name)" })
          $unexpected = @($twins | Where-Object { -not $pairs.Contains($_) })
          if ($unexpected.Count -gt 0) { throw "no schema for: $($unexpected -join ', ')" }
          $failed = 0
          foreach ($document in $pairs.Keys) {
            $schema = Join-Path $schemas $pairs[$document]
            $valid = Test-Json -Path $document -SchemaFile $schema -ErrorAction SilentlyContinue -ErrorVariable problems
            if ($valid) {
              Write-Output "${document}: valid against $($pairs[$document])"
            } else {
              $failed++
              # Test-Json reports errors from the top two levels of its results only.
              if ($problems.Count -eq 0) {
                Write-Output "::error file=${document}::not valid against $($pairs[$document]) (Test-Json gave no detail)"
              }
              foreach ($problem in $problems) { Write-Output "::error file=${document}::$problem" }
            }
          }
          if ($failed -gt 0) { throw "$failed manifest(s) failed schema validation" }
      # `brew audit` refuses file paths, so the formula goes into a local tap that is then trusted.
      # No --new or --online: they fetch the release URLs, which don't exist before a release.
      - name: Audit the Homebrew formula in a trusted local tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          set -euo pipefail
          # Homebrew is preinstalled on ubuntu-24.04 but not on PATH.
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew --version
          brew tap-new --no-git local/grimoire-ci
          tap="$(brew --repository local/grimoire-ci)"
          cp dist/agent-grimoire.rb "${tap}/Formula/agent-grimoire.rb"
          brew trust --tap local/grimoire-ci
          brew style local/grimoire-ci/agent-grimoire
          brew audit --strict --formula --os=all --arch=all local/grimoire-ci/agent-grimoire
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Check the npm version
        run: |
          set -euo pipefail
          actual="$(npm --version)"
          if [ "${actual}" != "${NPM_VERSION}" ]; then
            echo "::error::expected npm ${NPM_VERSION}, found ${actual}"
            exit 1
          fi
      # Without credentials npm only warns that a real publish would need a login.
      # On pull requests the registry is an unreachable local address: npm then sees no
      # published versions, so a PR between releases (whose version is already on npm)
      # still exercises the publish checks, offline. --force is avoided on purpose: it would
      # also skip the prerelease-tag check. A release checks against the real registry.
      - name: Dry-run the npm publishes
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/*.tgz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "::error::no npm tarballs in dist"
            exit 1
          fi
          registry=()
          if [ "${MODE}" = "dry-run" ]; then
            registry=(--registry=http://127.0.0.1:9/ --fetch-retries=0)
          fi
          for tarball in "${tarballs[@]}"; do
            npm stage publish --dry-run --ignore-scripts --access public "${registry[@]}" "./${tarball}"
          done

  # Pull requests cannot use actions/attest (it has no dry-run and needs id-token), so the dry-run
  # signs and verifies every file offline: a throwaway key and a signing config with no services,
  # hence no Fulcio, Rekor, timestamp authority or TUF traffic.
  sign-dry-run:
    name: sign (dry-run, offline)
    needs: [plan, package, verify-install, verify-linux]
    if: needs.plan.outputs.mode == 'dry-run'
    runs-on: ubuntu-24.04
    # Only artifacts of this run are read, which needs no token permission.
    permissions: {}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Sign and verify every file with a throwaway key
        run: |
          set -euo pipefail
          dist="${PWD}/dist"
          work="${RUNNER_TEMP}/cosign-dry-run"
          mkdir -p "${work}/bundles"
          cd "${work}"
          # A random password for this job only; it is masked and never stored.
          COSIGN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::${COSIGN_PASSWORD}"
          export COSIGN_PASSWORD
          cosign generate-key-pair --output-key-prefix dryrun
          cosign signing-config create --out offline-signing-config.json
          count=0
          for file in "${dist}"/*; do
            name="$(basename "${file}")"
            cosign sign-blob --yes --key dryrun.key --signing-config offline-signing-config.json \
              --bundle "bundles/${name}.sigstore.json" "${file}"
            cosign verify-blob --key dryrun.pub --insecure-ignore-tlog \
              --bundle "bundles/${name}.sigstore.json" "${file}"
            count=$((count + 1))
          done
          echo "signed and verified ${count} files"
          # A changed file must fail verification.
          cp "${dist}/SHA256SUMS" tampered
          printf 'tampered' >> tampered
          if cosign verify-blob --key dryrun.pub --insecure-ignore-tlog --bundle bundles/SHA256SUMS.sigstore.json tampered; then
            echo "::error::cosign verified a tampered file"
            exit 1
          fi
          echo "cosign rejected a tampered file"

  # The container image (ADR-0011, docs/container.md), built once from the release archives,
  # then checked and scanned before anything is published. publish-image later pushes exactly
  # this OCI layout, so the registry holds the bytes that were scanned, under the digest the
  # release notes name. No registry login and no token: every pull here is anonymous.
  image:
    name: container image (build, check, scan)
    needs: [plan, package]
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the Dockerfile and xtask
    outputs:
      layout-artifact-id: ${{ steps.upload-layout.outputs.artifact-id }}
      index-digest: ${{ steps.check.outputs.index-digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      # The artifact is the one the package job uploaded, unchanged, and holds nothing else.
      - name: Check the release assets
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums-sha256 }}
        run: |
          set -euo pipefail
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict --quiet -
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          expected="$( (cut -c 67- dist/SHA256SUMS; echo SHA256SUMS) | sort)"
          actual="$(cd dist && find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::dist/ does not hold exactly the files SHA256SUMS lists"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
      # Unpacked outside the checkout. The buildx plugin goes in a job-scoped DOCKER_CONFIG, which
      # the image steps name, so it wins over the runner's copy (installed unverified, and from the
      # 20261116 images on, newer than the 7-day rule allows; BUILD-P6).
      - name: Install buildx, crane and Grype (checksum-verified)
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/tools"
          mkdir -p "${tools}/download" "${RUNNER_TEMP}/docker/cli-plugins"
          cd "${tools}/download"
          curl -fsSLo docker-buildx "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          echo "${BUILDX_SHA256}  docker-buildx" | sha256sum -c -
          install -m 0755 docker-buildx "${RUNNER_TEMP}/docker/cli-plugins/docker-buildx"
          curl -fsSLo crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256_X64}  crane.tar.gz" | sha256sum -c -
          tar -xzf crane.tar.gz -C "${tools}" crane
          curl -fsSLo grype.tar.gz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          tar -xzf grype.tar.gz -C "${tools}" grype
          echo "${tools}" >> "${GITHUB_PATH}"
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The Dockerfile pins the base by digest. Its index and both platform manifests must carry
      # distroless's keyless signature. `check` later compares the image's lower layers, Env and
      # diff_ids with the manifests and configs fetched here (BASE-IMAGE-P6).
      - name: Prepare the build context and verify the base image
        run: |
          set -euo pipefail
          base="$(cargo --locked xtask release image base)"
          mkdir -p "${RUNNER_TEMP}/base"
          crane manifest "${base}" > "${RUNNER_TEMP}/base/index.json"
          cargo --locked xtask release image context --dist dist --base "${RUNNER_TEMP}/base" --out image
          while read -r ref; do
            cosign verify --certificate-identity "${DISTROLESS_IDENTITY}" \
              --certificate-oidc-issuer "${DISTROLESS_ISSUER}" "${ref}" > /dev/null
            echo "verified the signature of ${ref}"
            manifest="${RUNNER_TEMP}/base/${ref##*@sha256:}.json"
            crane manifest "${ref}" > "${manifest}"
            # Platform manifests name their config; `check` verifies each blob's digest.
            config="$(jq -r '.config.digest // empty' "${manifest}")"
            if [ -n "${config}" ]; then
              crane blob "${ref%@*}@${config}" > "${RUNNER_TEMP}/base/${config#sha256:}.json"
            fi
          done < image/base-refs
      # A docker-container builder on the pinned BuildKit: the runner's own Docker is too old for
      # attestations and multi-platform OCI output. provenance-add-gha=false keeps the GitHub
      # event payload out of the public provenance. buildx lets every docker-container builder
      # grant network.host (BUILD-P6); no build here asks for it: there is no --allow and no RUN.
      - name: Create the builder
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: |
          set -euo pipefail
          if ! docker buildx version | grep -qF "v${BUILDX_VERSION} "; then
            echo "::error::expected buildx ${BUILDX_VERSION}, found $(docker buildx version)"
            exit 1
          fi
          docker buildx create --name grimoire --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" --driver-opt provenance-add-gha=false --bootstrap
          # The version BuildKit reports, not the image option (which names it too).
          buildkit="${BUILDKIT_IMAGE#*:}"
          if ! docker buildx inspect grimoire | grep -qE "^BuildKit version:[[:space:]]+${buildkit%@*}\$"; then
            echo "::error::the builder does not run BuildKit ${buildkit%@*}"
            exit 1
          fi
      - name: Check the Dockerfile (build checks)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: docker buildx build --builder grimoire --check -f Dockerfile image/context
      # COPY steps only, so one amd64 runner builds both platforms without emulation. Platform
      # manifests are reproducible; the index is not, because the SBOMs and provenance hold
      # build times. No build argument carries anything secret: mode=max records them all.
      - name: Build the image (OCI layout, SBOM and provenance)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          BUILDER_ID: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mapfile -t args < image/buildx-args
          SOURCE_DATE_EPOCH="$(cat image/source-date-epoch)"
          export SOURCE_DATE_EPOCH
          docker buildx build --builder grimoire "${args[@]}" \
            --provenance "mode=max,builder-id=${BUILDER_ID}" \
            --attest "type=sbom,generator=${SBOM_SCANNER_IMAGE}" \
            --output "type=oci,dest=image/layout,tar=false,rewrite-timestamp=true" \
            -f Dockerfile image/context
      # One index with both platforms and their attestations, the annotations and configs, the
      # verified base's layers, and on top exactly the archived binaries, byte for byte.
      - name: Check the image
        id: check
        run: >-
          cargo --locked xtask release image check --out image --layout image/layout
          --base "${RUNNER_TEMP}/base" --github-output "${GITHUB_OUTPUT}"
      # The gate (the maintainer's choice, ADR-0011): any medium, high or critical match fails,
      # fixed or not. Grype exits 2 for a match and 1 for any other error; both fail the step.
      # --fail-on repeats .grype.yaml's threshold, because Grype ignores a misspelt key silently.
      # coverage fails when Grype saw no Debian packages or a binary shows no Rust packages,
      # which Grype would report as clean. Every platform is scanned before the step fails, so
      # the uploaded reports show every finding.
      - name: Scan with Grype
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          failed=0
          mapfile -t platforms < image/platforms
          for platform in "${platforms[@]}"; do
            name="${platform//\//-}"
            status=0
            grype -c .grype.yaml --fail-on medium "oci-dir:image/layout" --platform "${platform}" \
              -o table -o "json=image/grype-${name}.json" -o "cyclonedx-json=image/grype-${name}.cdx.json" \
              || status=$?
            if [ "${status}" -eq 0 ] || [ "${status}" -eq 2 ]; then
              cargo --locked xtask release image coverage --out image --report "image/grype-${name}.json" \
                --cdx "image/grype-${name}.cdx.json" --platform "${platform}" || status=1
            fi
            if [ "${status}" -ne 0 ]; then
              echo "::error::${platform}: the image gate failed (Grype exit ${status}; 2 means a finding)"
              failed=1
            fi
          done
          grype db status
          exit "${failed}"
      - name: Upload the scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan
          path: image/grype-*
          if-no-files-found: ignore
      - name: Upload the OCI layout
        id: upload-layout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-layout
          path: image/layout/
          if-no-files-found: error

  # Runs the image on each platform's own runner, exactly as it will be pushed: from a local
  # registry (crane's, which like GHCR has no referrers API), on the runner's Docker. PR dry-runs
  # also sign it with a throwaway key and verify it, offline.
  verify-image:
    name: verify image (${{ matrix.platform }})
    needs: [plan, image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Only this commit, artifacts of this run and a registry on localhost are used.
    permissions:
      contents: read # check out .github/scripts/image-tags.sh
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      INDEX_DIGEST: ${{ needs.image.outputs.index-digest }}
      LOCAL_IMAGE: localhost:5000/grimoire@${{ needs.image.outputs.index-digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the OCI layout
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.layout-artifact-id }}
          merge-multiple: true
          path: layout
      - name: Check that it is the layout the image job checked
        run: |
          set -euo pipefail
          if [ "$(jq -r '[.manifests[].digest] | join(" ")' layout/index.json)" != "${INDEX_DIGEST}" ]; then
            echo "::error::layout/index.json does not name exactly ${INDEX_DIGEST}"
            exit 1
          fi
          echo "${INDEX_DIGEST#sha256:}  layout/blobs/sha256/${INDEX_DIGEST#sha256:}" | sha256sum --check --strict -
      - name: Install crane (checksum-verified)
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64) arch=x86_64 sum="${CRANE_SHA256_X64}" ;;
            ARM64) arch=arm64 sum="${CRANE_SHA256_ARM64}" ;;
            *) echo "::error::no crane for ${RUNNER_ARCH}"; exit 1 ;;
          esac
          mkdir -p "${RUNNER_TEMP}/crane"
          cd "${RUNNER_TEMP}/crane"
          curl -fsSLo crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_${arch}.tar.gz"
          echo "${sum}  crane.tar.gz" | sha256sum -c -
          tar -xzf crane.tar.gz crane
          echo "${RUNNER_TEMP}/crane" >> "${GITHUB_PATH}"
      # The registry keeps manifests in memory and lives until the job ends.
      - name: Push to a local registry
        run: |
          set -euo pipefail
          nohup crane registry serve --address 127.0.0.1:5000 > "${RUNNER_TEMP}/registry.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fs -o /dev/null http://127.0.0.1:5000/v2/; then break; fi
            sleep 1
          done
          crane push --image-refs "${RUNNER_TEMP}/pushed" layout "localhost:5000/grimoire:${VERSION}"
          if [ "$(cat "${RUNNER_TEMP}/pushed")" != "${LOCAL_IMAGE}" ]; then
            echo "::error::crane pushed $(cat "${RUNNER_TEMP}/pushed"), not ${LOCAL_IMAGE}"
            exit 1
          fi
          docker pull --quiet "${LOCAL_IMAGE}"
      - name: Run every binary
        run: |
          set -euo pipefail
          arch="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${LOCAL_IMAGE}")"
          if [ "${arch}" != "${PLATFORM}" ]; then
            echo "::error::the runner pulled ${arch}, not ${PLATFORM}"
            exit 1
          fi
          hardened=(--rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges)
          out="$(docker run "${hardened[@]}" "${LOCAL_IMAGE}" --version)"
          if [ "${out}" != "grimoire ${VERSION}" ]; then
            echo "::error::grimoire --version printed '${out}'"
            exit 1
          fi
          mapfile -t assets < <(crane export --platform "${PLATFORM}" "${LOCAL_IMAGE}" - | tar -t | sed -n 's|^opt/grimoire/bin/\([^/][^/]*\)$|\1|p')
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::the image holds no asset binaries"
            exit 1
          fi
          for bin in "${assets[@]}"; do
            out="$(docker run "${hardened[@]}" --entrypoint "/opt/grimoire/bin/${bin}" "${LOCAL_IMAGE}" --version)"
            case "${out}" in "${bin} "*) echo "${out}" ;; *) echo "::error::${bin} --version printed '${out}'"; exit 1 ;; esac
          done
      # As docs/container.md shows it: the runner's Docker is rootful, so --user keeps the files
      # the CLI writes owned by the runner's user.
      - name: Use the CLI on a mounted repository
        run: |
          set -euo pipefail
          repo="${RUNNER_TEMP}/repo"
          mkdir -p "${repo}/docs/adr"
          printf '# Guide\n' > "${repo}/docs/guide.md"
          printf '# ADR-0001: Use Rust\n\n- **Status:** Accepted\n- **Date:** 2026-11-17\n' > "${repo}/docs/adr/0001-use-rust.md"
          grimoire=(docker run --rm --init --network none --read-only --cap-drop ALL --security-opt no-new-privileges
            --user "$(id -u):$(id -g)" --mount "type=bind,src=${repo},dst=/repo" "${LOCAL_IMAGE}")
          "${grimoire[@]}" init --client claude-code --no-input
          "${grimoire[@]}" add conventional-commits --apply --no-input
          "${grimoire[@]}" verify
          if [ "$(stat -c %u "${repo}/.claude/rules/conventional-commits.md")" != "$(id -u)" ]; then
            echo "::error::the CLI's files are not owned by the runner's user"
            exit 1
          fi
      # A stdio MCP session, as a client starts one: -i, a read-only mount, no network.
      - name: Talk to the MCP server over stdio
        run: |
          set -euo pipefail
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"release-ci","version":"0"}}}'
          response="$(printf '%s\n' "${request}" | docker run -i --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --mount "type=bind,src=${RUNNER_TEMP}/repo,dst=/repo,readonly" \
            --entrypoint /opt/grimoire/bin/grimoire-mcp-project-docs "${LOCAL_IMAGE}" --root /repo)"
          if ! jq -e '.id == 1 and .result.serverInfo.name == "grimoire-mcp-project-docs"' <<<"${response}" > /dev/null; then
            echo "::error::unexpected initialize response: ${response}"
            exit 1
          fi
          echo "initialize answered by $(jq -r '.result.serverInfo | "\(.name) \(.version)"' <<<"${response}")"
      - name: Install cosign
        if: env.MODE == 'dry-run' && matrix.platform == 'linux/amd64'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # As sign.yml signs, but with a throwaway key and a signing config that names no services,
      # so nothing reaches Rekor. The signature must land in the referrers fallback tag. Then the
      # release's registry steps run against this registry, refusals included.
      - name: Sign, verify and tag with a throwaway key (dry-run, offline)
        if: env.MODE == 'dry-run' && matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/cosign-dry-run"
          mkdir -p "${work}"
          cd "${work}"
          # A random password for this job only; it is masked and never stored.
          COSIGN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::${COSIGN_PASSWORD}"
          export COSIGN_PASSWORD
          cosign generate-key-pair --output-key-prefix dryrun
          cosign signing-config create --out offline-signing-config.json
          cosign sign --yes --key dryrun.key --signing-config offline-signing-config.json "${LOCAL_IMAGE}"
          cosign verify --key dryrun.pub --insecure-ignore-tlog "${LOCAL_IMAGE}" > /dev/null
          crane manifest "localhost:5000/grimoire:sha256-${INDEX_DIGEST#sha256:}" > referrers.json
          if ! jq -e '[.manifests[] | select(.artifactType == "application/vnd.dev.sigstore.bundle.v0.3+json"
                and .annotations["dev.sigstore.bundle.predicateType"] == "https://sigstore.dev/cosign/sign/v1")]
                | length == 1' referrers.json > /dev/null; then
            echo "::error::the signature is not in the referrers fallback tag"
            exit 1
          fi
          # The signature names the index only: a platform manifest must not verify.
          platform_digest="$(crane digest --platform linux/amd64 "${LOCAL_IMAGE}")"
          if cosign verify --key dryrun.pub --insecure-ignore-tlog "localhost:5000/grimoire@${platform_digest}" > /dev/null 2>&1; then
            echo "::error::cosign verified a manifest that was not signed"
            exit 1
          fi
          echo "signed and verified ${LOCAL_IMAGE}; an unsigned digest was rejected"

          # The release's registry steps (.github/scripts/image-tags.sh), on a fresh repository.
          script="${GITHUB_WORKSPACE}/.github/scripts/image-tags.sh"
          repo=localhost:5000/tags
          verify=(cosign verify --key dryrun.pub --insecure-ignore-tlog)
          refused() {
            if "$@" > refused.log 2>&1; then
              cat refused.log
              echo "::error::expected to fail: $*"
              exit 1
            fi
            echo "refused, as expected: $(tail -n 1 refused.log)"
          }
          # Push by digest and tag the version, each twice: the second time does nothing.
          bash "${script}" push "${repo}" "${INDEX_DIGEST}" "${VERSION}" "${GITHUB_WORKSPACE}/layout"
          bash "${script}" push "${repo}" "${INDEX_DIGEST}" "${VERSION}" "${GITHUB_WORKSPACE}/layout"
          bash "${script}" tag "${repo}" "${INDEX_DIGEST}" "${VERSION}"
          bash "${script}" tag "${repo}" "${INDEX_DIGEST}" "${VERSION}"
          # A version tag that names another digest is never overwritten.
          platform="$(crane digest --platform linux/amd64 "${repo}@${INDEX_DIGEST}")"
          crane tag "${repo}@${platform}" 9.9.9
          refused bash "${script}" push "${repo}" "${INDEX_DIGEST}" 9.9.9 "${GITHUB_WORKSPACE}/layout"
          refused bash "${script}" tag "${repo}" "${INDEX_DIGEST}" 9.9.9
          # A registry that can't be read is never taken for an absent tag.
          refused bash "${script}" push localhost:5999/none "${INDEX_DIGEST}" "${VERSION}" "${GITHUB_WORKSPACE}/layout"
          # latest moves forward from an image that claims no newer version...
          crane tag "${repo}@${platform}" latest
          bash "${script}" latest "${repo}" "${INDEX_DIGEST}" "${VERSION}" -- "${verify[@]}"
          if [ "$(crane digest "${repo}:latest")" != "${INDEX_DIGEST}" ]; then
            echo "::error::latest did not move forward"
            exit 1
          fi
          # ...stops at an image that claims a newer version without the release signature...
          newer="$(crane mutate "${repo}@${platform}" --annotation org.opencontainers.image.version=99.0.0 --tag "${repo}:newer")"
          newer="${newer##*@}"
          crane tag "${repo}@${newer}" latest
          refused bash "${script}" latest "${repo}" "${INDEX_DIGEST}" "${VERSION}" -- "${verify[@]}"
          # ...and stays on a newer signed release.
          cosign sign --yes --key dryrun.key --signing-config offline-signing-config.json "${repo}@${newer}"
          bash "${script}" latest "${repo}" "${INDEX_DIGEST}" "${VERSION}" -- "${verify[@]}"
          if [ "$(crane digest "${repo}:latest")" != "${newer}" ]; then
            echo "::error::latest moved back from a newer signed release"
            exit 1
          fi
          echo "image-tags.sh: every case behaved"

  # Every signature and attestation is made in sign.yml, whose certificates no job in this file
  # can get: the publish jobs below (and the PyPI action's container) can't sign as the release
  # (SIGN-P6, the maintainer's choice). Its jobs run only when release.yml on main calls them.
  sign-files:
    name: sign the release files (release)
    needs: [plan, package, verify-install, verify-linux]
    if: needs.plan.outputs.mode == 'release'
    permissions:
      id-token: write # actions/attest and cosign get their Sigstore signing certificates with the job's OIDC token
      attestations: write # actions/attest stores the provenance and SBOM attestations on this repository
    uses: ./.github/workflows/sign.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the `$/` form
    with:
      target: files
      dist-artifact-id: ${{ needs.package.outputs.dist-artifact-id }}
      sums-sha256: ${{ needs.package.outputs.sums-sha256 }}
      archives: ${{ needs.plan.outputs.archives }}

  # Publishing, in four jobs with four environments (the maintainer's choice, ADR-0009): each
  # registry's trusted publisher accepts only its own environment, so code in one job (the PyPI
  # action's container, say) can never get a token for another registry.
  #   publish (release): verify everything, then the tag and the GitHub Release, which install.sh,
  #     install.ps1, Homebrew, Scoop and winget download from. No OIDC.
  #   publish-crates (crates-io), publish-npm (npm), publish-pypi (pypi): after it, approved together.
  # Every step skips what is already done, so "Re-run failed jobs" on this run finishes a partial
  # release (see docs/release.md for staged npm versions). A new run would see the tag and plan `skip`.
  # Only release mode names the environments: a run that names a missing environment creates it
  # without protection rules.
  publish:
    name: publish GitHub Release (release)
    needs: [plan, package, sign-files, image, verify-image]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.plan.outputs.mode == 'release' && 'release' || '' }}
    permissions:
      contents: write # create the tag and the GitHub Release, and upload the release assets
      attestations: read # gh attestation verify reads this repository's attestations
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      # The container image's index digest, which the notes name and publish-image pushes.
      IMAGE_DIGEST: ${{ needs.image.outputs.index-digest }}
      # The repository every `gh release` command acts on.
      GH_REPO: ${{ github.repository }}
      # sign.yml, called from jabbott-iii/Grimoire on main (SIGN-P6).
      COSIGN_IDENTITY: https://github.com/jabbott-iii/Grimoire/.github/workflows/sign.yml@refs/heads/main
      COSIGN_ISSUER: https://token.actions.githubusercontent.com
      COSIGN_REPOSITORY: jabbott-iii/Grimoire
      COSIGN_REF: refs/heads/main
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Download the cosign bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-files.outputs.sigstore-artifact-id }}
          merge-multiple: true
          path: dist
      # The artifact is the one the package job uploaded, unchanged, and holds nothing else.
      - name: Check the release assets
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums-sha256 }}
        run: |
          set -euo pipefail
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict --quiet -
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          expected="$( (cut -c 67- dist/SHA256SUMS; echo SHA256SUMS) | sort)"
          actual="$(cd dist && find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::dist/ does not hold exactly the files SHA256SUMS lists"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify SHA256SUMS
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::unexpected tag '${TAG}' for version '${VERSION}'"
            exit 1
          fi
          cargo --locked xtask release checksums --dist dist --check
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Verify every cosign bundle
        run: |
          set -euo pipefail
          for file in dist/*; do
            case "${file}" in *.sigstore.json) continue ;; esac
            if [ ! -f "${file}.sigstore.json" ]; then
              echo "::error::no cosign bundle for ${file}"
              exit 1
            fi
            cosign verify-blob --bundle "${file}.sigstore.json" \
              --certificate-identity "${COSIGN_IDENTITY}" \
              --certificate-oidc-issuer "${COSIGN_ISSUER}" \
              --certificate-github-workflow-repository "${COSIGN_REPOSITORY}" \
              --certificate-github-workflow-ref "${COSIGN_REF}" "${file}"
          done
          for bundle in dist/*.sigstore.json; do
            if [ ! -f "${bundle%.sigstore.json}" ]; then
              echo "::error::${bundle} signs no release file"
              exit 1
            fi
          done
      - name: Verify the build provenance of SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh_version="$(gh --version | sed -n 's/^gh version \([0-9][0-9.]*\).*/\1/p')"
          if [ "$(printf '%s\n' 2.102.0 "${gh_version}" | sort -V | head -n 1)" != "2.102.0" ]; then
            echo "::error::gh ${gh_version} is older than 2.102.0"
            exit 1
          fi
          # sign.yml made it, called from release.yml (Build Config URI, which no gh flag pins).
          gh attestation verify dist/SHA256SUMS \
            --repo jabbott-iii/Grimoire \
            --signer-workflow jabbott-iii/Grimoire/.github/workflows/sign.yml@refs/heads/main \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "${RUNNER_TEMP}/attestation.json"
          # What no gh flag pins: the caller workflow file, and the repository and owner IDs.
          caller="https://github.com/jabbott-iii/Grimoire/.github/workflows/release.yml@refs/heads/main"
          if ! jq -e --arg caller "${caller}" 'length > 0 and all(.[]; .verificationResult.signature.certificate
                | .buildConfigURI == $caller and .sourceRepositoryIdentifier == "1460666977"
                  and .sourceRepositoryOwnerIdentifier == "84321953")' \
              "${RUNNER_TEMP}/attestation.json" > /dev/null; then
            echo "::error::the provenance of SHA256SUMS wasn't made by sign.yml called from ${caller} in this repository"
            exit 1
          fi
      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          err="${RUNNER_TEMP}/tag.err"
          if ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>"${err}")"; then
            type="$(jq -r '.object.type' <<<"${ref}")"
            sha="$(jq -r '.object.sha' <<<"${ref}")"
            if [ "${type}" = "tag" ]; then
              sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
            fi
            if [ "${sha}" != "${GITHUB_SHA}" ]; then
              echo "::error::tag ${TAG} already points at ${sha}, not at ${GITHUB_SHA}"
              exit 1
            fi
            echo "tag ${TAG} already points at ${GITHUB_SHA}"
          elif grep -q 'HTTP 404' "${err}"; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
            echo "created tag ${TAG} at ${GITHUB_SHA}"
          else
            cat "${err}" >&2
            exit 1
          fi
      - name: Write the release notes
        run: >-
          cargo --locked xtask release notes --version "${VERSION}" --image-digest "${IMAGE_DIGEST}"
          --out "${RUNNER_TEMP}/release-notes.md"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          err="${RUNNER_TEMP}/release.err"
          if release="$(gh release view "${TAG}" --json isDraft,assets 2>"${err}")"; then
            state="$(jq -r 'if .isDraft then "draft" else "published" end' <<<"${release}")"
          elif grep -q 'release not found' "${err}"; then
            state=missing
          else
            cat "${err}" >&2
            exit 1
          fi
          echo "release ${TAG}: ${state}"
          if [ "${state}" = "missing" ]; then
            gh release create "${TAG}" --draft --verify-tag --title "${TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
            state=draft
          fi
          if [ "${state}" = "draft" ]; then
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --draft=false
          else
            expected="$(cd dist && for f in *; do printf '%s sha256:%s\n' "${f}" "$(sha256sum "${f}" | cut -d ' ' -f 1)"; done | sort)"
            actual="$(jq -r '.assets[] | "\(.name) \(.digest)"' <<<"${release}" | sort)"
            if [ "${expected}" != "${actual}" ]; then
              echo "::error::published release ${TAG} does not hold exactly the files in dist"
              diff <(echo "${expected}") <(echo "${actual}") || true
              exit 1
            fi
            echo "published release ${TAG} already holds exactly the files in dist"
          fi
          immutable="$(gh release view "${TAG}" --json isImmutable --jq '.isImmutable')"
          echo "release ${TAG} immutable: ${immutable}"
          if [ "${immutable}" != "true" ]; then
            echo "::warning::release ${TAG} is not immutable; enable release immutability in the repository settings"
          fi

  # crates.io: only versions not yet published. The token step and the publish step are
  # skipped when nothing is pending, so CARGO_REGISTRY_TOKEN is never set to an empty value.
  publish-crates:
    name: publish to crates.io (release)
    needs: [plan, publish]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.plan.outputs.mode == 'release' && 'crates-io' || '' }}
    permissions:
      contents: read
      id-token: write # trusted publishing: an OIDC token for crates.io, bound to environment crates-io
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Find the crates not yet on crates.io
        id: crates
        env:
          CRATES: ${{ needs.plan.outputs.crates }}
          USER_AGENT: agent-grimoire-release (+https://github.com/jabbott-iii/Grimoire)
        run: |
          set -euo pipefail
          mapfile -t names < <(jq -r '.[]' <<<"${CRATES}")
          pending=()
          for name in "${names[@]}"; do
            if ! [[ "${name}" =~ ^[a-z0-9_-]+$ ]]; then
              echo "::error::unexpected crate name '${name}'"
              exit 1
            fi
            code="$(curl -sS --retry 3 -A "${USER_AGENT}" -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/${name}/${VERSION}")"
            case "${code}" in
              200) echo "${name} ${VERSION} is already on crates.io" ;;
              404) pending+=("${name}") ;;
              *)
                echo "::error::crates.io answered HTTP ${code} for ${name} ${VERSION}"
                exit 1
                ;;
            esac
          done
          echo "pending: ${pending[*]:-none}"
          echo "pending=${pending[*]}" >> "${GITHUB_OUTPUT}"
      - name: Get a crates.io token (trusted publishing)
        id: crates-io-auth
        if: steps.crates.outputs.pending != ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crates
        if: steps.crates.outputs.pending != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          PENDING: ${{ steps.crates.outputs.pending }}
        run: |
          set -euo pipefail
          read -r -a names <<<"${PENDING}"
          packages=()
          for name in "${names[@]}"; do packages+=(-p "${name}"); done
          cargo publish --locked "${packages[@]}"

  publish-npm:
    name: stage on npm (release)
    needs: [plan, package, publish]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.plan.outputs.mode == 'release' && 'npm' || '' }}
    permissions:
      id-token: write # trusted publishing: an OIDC token for npm, bound to environment npm
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      # The artifact is the one the package job uploaded, unchanged, and holds nothing else.
      - name: Check the release assets
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums-sha256 }}
        run: |
          set -euo pipefail
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict --quiet -
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          expected="$( (cut -c 67- dist/SHA256SUMS; echo SHA256SUMS) | sort)"
          actual="$(cd dist && find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::dist/ does not hold exactly the files SHA256SUMS lists"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Check the npm version
        run: |
          set -euo pipefail
          actual="$(npm --version)"
          if [ "${actual}" != "${NPM_VERSION}" ]; then
            echo "::error::expected npm ${NPM_VERSION}, found ${actual}"
            exit 1
          fi
      - name: Stage the npm packages
        run: |
          set -euo pipefail
          on_registry() {
            local out
            if out="$(npm view "$1@$2" version 2>"${RUNNER_TEMP}/npm-view.err")"; then
              [ -n "${out}" ]
              return
            fi
            if grep -q E404 "${RUNNER_TEMP}/npm-view.err"; then return 1; fi
            cat "${RUNNER_TEMP}/npm-view.err" >&2
            echo "::error::npm view $1@$2 failed"
            exit 1
          }
          # A staged version isn't public yet, so `npm view` can't see it, and npm refuses to
          # stage the same version twice. Approve or reject the earlier stage first.
          stage() {
            if on_registry "$1" "${VERSION}"; then
              echo "$1@${VERSION} is already on the registry"
            elif ! npm stage publish --access public --ignore-scripts "./$2"; then
              echo "::error::npm refused to stage $1@${VERSION}. If an earlier run staged it, approve or reject that version under Staged Packages on npmjs.com, then re-run this job."
              exit 1
            fi
          }
          launcher=""
          platforms=()
          for tarball in dist/*.tgz; do
            manifest="$(tar -xzOf "${tarball}" package/package.json)"
            name="$(jq -r '.name' <<<"${manifest}")"
            version="$(jq -r '.version' <<<"${manifest}")"
            if [ "${version}" != "${VERSION}" ]; then
              echo "::error::${tarball} is version ${version}, expected ${VERSION}"
              exit 1
            fi
            case "${name}" in
              agent-grimoire) launcher="${tarball}" ;;
              @agent-grimoire/*) platforms+=("${name}=${tarball}") ;;
              *)
                echo "::error::${tarball} holds unexpected package ${name}"
                exit 1
                ;;
            esac
          done
          if [ -z "${launcher}" ] || [ "${#platforms[@]}" -ne 6 ]; then
            echo "::error::expected the launcher and six platform tarballs in dist"
            exit 1
          fi
          for entry in "${platforms[@]}"; do
            stage "${entry%%=*}" "${entry#*=}"
          done
          stage agent-grimoire "${launcher}"

  # The PyPI action runs a container image referenced by tag, not digest (ADR-0009), so this
  # job holds nothing but the wheels and a token only PyPI accepts.
  publish-pypi:
    name: publish to PyPI (release)
    needs: [plan, package, publish]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.plan.outputs.mode == 'release' && 'pypi' || '' }}
    permissions:
      id-token: write # trusted publishing: an OIDC token for PyPI, bound to environment pypi
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      # The artifact is the one the package job uploaded, unchanged, and holds nothing else.
      - name: Check the release assets
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums-sha256 }}
        run: |
          set -euo pipefail
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict --quiet -
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          expected="$( (cut -c 67- dist/SHA256SUMS; echo SHA256SUMS) | sort)"
          actual="$(cd dist && find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::dist/ does not hold exactly the files SHA256SUMS lists"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
      - name: Collect the wheels
        run: |
          set -euo pipefail
          mkdir -p pypi-dist
          cp dist/*.whl pypi-dist/
      - name: Publish the wheels to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-dist/
          skip-existing: true

  # The container image, pushed from environment `ghcr` after the GitHub Release (ADR-0011):
  # exactly the OCI layout the image job checked and scanned, by digest and untagged, so its
  # digest is the one the release notes name. No OIDC token here; sign-image signs, attests and
  # only then tags it. Every step skips what is already done, so "Re-run failed jobs" finishes.
  publish-image:
    name: push the container image (release)
    needs: [plan, image, verify-image, publish]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.plan.outputs.mode == 'release' && 'ghcr' || '' }}
    permissions:
      contents: read # check out .github/scripts/image-tags.sh
      packages: write # push to ghcr.io/jabbott-iii/grimoire
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      INDEX_DIGEST: ${{ needs.image.outputs.index-digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the OCI layout
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.layout-artifact-id }}
          merge-multiple: true
          path: layout
      - name: Check that it is the layout the image job checked
        run: |
          set -euo pipefail
          if [ "$(jq -r '[.manifests[].digest] | join(" ")' layout/index.json)" != "${INDEX_DIGEST}" ]; then
            echo "::error::layout/index.json does not name exactly ${INDEX_DIGEST}"
            exit 1
          fi
          echo "${INDEX_DIGEST#sha256:}  layout/blobs/sha256/${INDEX_DIGEST#sha256:}" | sha256sum --check --strict -
      - name: Install crane (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          cd "${RUNNER_TEMP}/crane"
          curl -fsSLo crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256_X64}  crane.tar.gz" | sha256sum -c -
          tar -xzf crane.tar.gz crane
          echo "${RUNNER_TEMP}/crane" >> "${GITHUB_PATH}"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "${GH_TOKEN}" | crane auth login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      # By digest, untagged: an existing X.Y.Z that names another digest stops the job, and so
      # does a lookup that fails for any reason other than the registry's "unknown" answer.
      - name: Push the image by digest
        run: bash .github/scripts/image-tags.sh push "${IMAGE}" "${INDEX_DIGEST}" "${VERSION}" layout
      - name: Log out of GHCR
        if: always()
        run: crane auth logout ghcr.io || true

  # Signs and attests the pushed image in sign.yml, whose certificates no job in this file can
  # get, then tags X.Y.Z and moves latest (SIGN-P6). A job that calls a reusable workflow can't
  # name an environment; the push above was the approved step.
  sign-image:
    name: sign the container image (release)
    needs: [plan, image, publish-image]
    if: needs.plan.outputs.mode == 'release'
    permissions:
      contents: read # sign.yml checks out .github/scripts/image-tags.sh; actions/attest reads the repository
      packages: write # store the signature and the attestation next to the image, and tag it
      id-token: write # cosign and actions/attest get their Sigstore signing certificates
      attestations: write # actions/attest stores the provenance attestation on this repository
    uses: ./.github/workflows/sign.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the `$/` form
    with:
      target: image
      version: ${{ needs.plan.outputs.version }}
      index-digest: ${{ needs.image.outputs.index-digest }}

  # One stable check for the ruleset to require: it fails when any check above failed or was
  # cancelled, and on pull requests also when one was skipped. A required check whose job is
  # skipped would otherwise count as passed.
  release-checks:
    name: release checks
    needs: [plan, build, package, verify-install, verify-linux, sign-dry-run, image, verify-image]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every check to pass
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${RESULTS}"
          if [ "${MODE}" = "dry-run" ]; then
            bad="$(jq '[.[] | select(.result != "success")] | length' <<<"${RESULTS}")"
          else
            # Release and skip runs skip some of these jobs by design.
            bad="$(jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length' <<<"${RESULTS}")"
          fi
          if [ -z "${MODE}" ] || [ "${bad}" -ne 0 ]; then
            echo "::error::release checks failed (mode '${MODE}')"
            exit 1
          fi
