# Supply-chain and secret checks: on every pull request, every push to main, and weekly
# so that newly published advisories surface without a code change.
name: Security

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      # Built from crates.io with its lockfile: Cargo verifies every crate checksum.
      # Pinned releases are at least 7 days old when adopted, matching the Dependabot cooldown.
      - name: Install cargo-deny 0.20.2
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check advisories, bans, licenses and sources
        run: cargo deny --locked check

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan every commit
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 .'

  workflows:
    name: workflow audit (zizmor, actionlint)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blocking: advanced-security false keeps zizmor's failing exit codes. Online audits use the job token.
      - name: Run zizmor (pedantic)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic
          version: 1.32.0
          advanced-security: false
          annotations: true
      - name: Install actionlint (checksum-verified)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: Run actionlint
        run: '"${RUNNER_TEMP}/actionlint" -color'

  actions-lock:
    name: actions.lock is complete and current
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTIONS_LOCK_VERSION: "v0.4.1"
      ACTIONS_LOCK_SHA256: "39deb2fe714dbf74b073d8245fc7f3d50cd0eee18d5c0900e9e849ae933ae17e"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock (checksum-verified)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSLo gh-actions-lock "https://github.com/github/gh-actions-lock/releases/download/${ACTIONS_LOCK_VERSION}/linux-amd64"
          echo "${ACTIONS_LOCK_SHA256}  gh-actions-lock" | sha256sum -c -
          chmod +x gh-actions-lock
      - name: Verify the workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"${RUNNER_TEMP}/gh-actions-lock" --verify'
