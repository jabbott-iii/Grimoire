# Supply-chain and secret checks: on every pull request, every push to main, and weekly
# so that newly published advisories surface without a code change.
name: Security

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

# Scheduled and manual runs get their own group, so a push to main can't cancel the weekly
# image scan (which push runs don't repeat).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      # Built from crates.io with its lockfile: Cargo verifies every crate checksum.
      # Pinned releases are at least 7 days old when adopted, matching the Dependabot cooldown.
      - name: Install cargo-deny 0.20.2
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check advisories, bans, licenses and sources
        run: cargo deny --locked check

  # The latest release's container image, rescanned every week (ADR-0011): Dependabot opens no
  # security updates for Docker images, so a new advisory against the base image or a crate
  # shows up here first. The gate and .grype.yaml are the ones release.yml uses. Before the
  # first release there is no image, and the job says so and passes.
  image-scan:
    name: released image scan (Grype)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out .grype.yaml, and find the latest release
    env:
      # The same pins as release.yml; `cargo test -p xtask` fails when they differ.
      IMAGE: ghcr.io/jabbott-iii/grimoire
      CRANE_VERSION: "0.22.1"
      CRANE_SHA256_X64: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
      GRYPE_VERSION: "0.121.3"
      GRYPE_SHA256: "e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85"
      # sign-image.yml, called from jabbott-iii/Grimoire on main (SIGN-P6).
      COSIGN_IDENTITY: https://github.com/jabbott-iii/Grimoire/.github/workflows/sign-image.yml@refs/heads/main
      COSIGN_ISSUER: https://token.actions.githubusercontent.com
      COSIGN_REPOSITORY: jabbott-iii/Grimoire
      COSIGN_REF: refs/heads/main
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install crane and Grype (checksum-verified)
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/tools"
          mkdir -p "${tools}/download"
          cd "${tools}/download"
          curl -fsSLo crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256_X64}  crane.tar.gz" | sha256sum -c -
          tar -xzf crane.tar.gz -C "${tools}" crane
          curl -fsSLo grype.tar.gz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          tar -xzf grype.tar.gz -C "${tools}" grype
          echo "${tools}" >> "${GITHUB_PATH}"
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The version tag can be moved, so the digest it names must carry this repository's
      # release signature before anything trusts it.
      - name: Find and verify the latest release's image
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          err="${RUNNER_TEMP}/release.err"
          if ! tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName 2>"${err}")"; then
            if grep -q 'release not found' "${err}"; then
              echo "::notice::there is no release yet, so there is no image to scan"
              echo "digest=" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            cat "${err}" >&2
            exit 1
          fi
          if ! digest="$(crane digest "${IMAGE}:${tag#v}" 2>"${err}")"; then
            cat "${err}" >&2
            echo "::error::${tag} has no image ${IMAGE}:${tag#v} that can be pulled anonymously: finish its publish-image and sign-image jobs (sign-image sets the tag), or make the package public (docs/05-release.md, "During the first release run")"
            exit 1
          fi
          cosign verify --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_ISSUER}" \
            --certificate-github-workflow-repository "${COSIGN_REPOSITORY}" \
            --certificate-github-workflow-ref "${COSIGN_REF}" "${IMAGE}@${digest}" > /dev/null
          echo "${tag}: ${IMAGE}@${digest}, signed by sign-image.yml"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Scan every platform with Grype
        if: steps.find.outputs.digest != ''
        env:
          DIGEST: ${{ steps.find.outputs.digest }}
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          mapfile -t platforms < <(crane manifest "${IMAGE}@${DIGEST}" \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"')
          if [ "${#platforms[@]}" -eq 0 ]; then
            echo "::error::${IMAGE}@${DIGEST} lists no platforms"
            exit 1
          fi
          for platform in "${platforms[@]}"; do
            grype -c .grype.yaml --fail-on medium "registry:${IMAGE}@${DIGEST}" --platform "${platform}"
          done

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan every commit
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 .'

  workflows:
    name: workflow audit (zizmor, actionlint)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      # The same pin as release.yml's verify-linux; `cargo test -p xtask` fails when they differ.
      SHELLCHECK_VERSION: "v0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blocking: advanced-security false keeps zizmor's failing exit codes. Online audits use the job token.
      # `inputs` adds the workflow templates for the tap and bucket repositories to the default `.`;
      # the action word-splits and globs the list in bash (action.sh at v0.8.1), and a pattern
      # that matches nothing reaches zizmor as a missing path, which fails the step.
      - name: Run zizmor (pedantic)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic
          version: 1.32.0
          advanced-security: false
          annotations: true
          inputs: . packaging/homebrew-tap/*.yml packaging/scoop-bucket/*.yml
      # .github/scripts/image-tags.sh is a language-policy exception (ADR-0010, ADR-0011).
      - name: Install ShellCheck (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/shellcheck"
          cd "${RUNNER_TEMP}/shellcheck"
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
      - name: Run ShellCheck on the workflow scripts
        run: '"${RUNNER_TEMP}/shellcheck/shellcheck-${SHELLCHECK_VERSION}/shellcheck" .github/scripts/*.sh'
      - name: Install actionlint (checksum-verified)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: Run actionlint
        run: '"${RUNNER_TEMP}/actionlint" -color'
      # Templates for the jabbott-iii/homebrew-tap and jabbott-iii/scoop-bucket repositories.
      - name: Run actionlint on the workflow templates
        run: '"${RUNNER_TEMP}/actionlint" -color packaging/homebrew-tap/*.yml packaging/scoop-bucket/*.yml'

  actions-lock:
    name: actions.lock is complete and current
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTIONS_LOCK_VERSION: "v0.4.1"
      ACTIONS_LOCK_SHA256: "39deb2fe714dbf74b073d8245fc7f3d50cd0eee18d5c0900e9e849ae933ae17e"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock (checksum-verified)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSLo gh-actions-lock "https://github.com/github/gh-actions-lock/releases/download/${ACTIONS_LOCK_VERSION}/linux-amd64"
          echo "${ACTIONS_LOCK_SHA256}  gh-actions-lock" | sha256sum -c -
          chmod +x gh-actions-lock
      - name: Verify the workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"${RUNNER_TEMP}/gh-actions-lock" --verify'
