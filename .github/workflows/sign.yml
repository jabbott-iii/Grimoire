# Every signature and attestation of the release files (ADR-0011, SIGN-P6). Only jobs in this
# reusable workflow get a Sigstore certificate that names it:
#   https://github.com/jabbott-iii/Grimoire/.github/workflows/sign.yml@refs/heads/main
# No other job in release.yml can, so the publish jobs, and the third-party code they run (such
# as the PyPI action's tag-pinned container), can't sign as the release. The container image is
# signed by sign-image.yml, a separate file because GitHub checks every job of a called workflow
# against the calling job's permissions, even a job its `if:` would skip: one file for both would
# make the files call grant the image job's packages: write.
#
# Any repository can call a public reusable workflow and get a certificate with that same name,
# with the caller recorded in other fields. So every job here runs only when release.yml on
# main in this repository called it, and every verifier also pins the caller: cosign with
# --certificate-github-workflow-repository and --certificate-github-workflow-ref, gh with
# --repo and --source-ref.
#
# It makes a provenance attestation over every release file, an SBOM attestation per archive,
# and a keyless cosign bundle per file (output: sigstore-artifact-id).
#
# Inputs reach run steps only through env. Hardening as in release.yml (zizmor pedantic):
# permissions {} at the top with minimal per-job grants (the calling job grants them first),
# full-SHA pins, persist-credentials: false, no caches, no workflow-level concurrency (the
# caller's governs the run).
name: Sign

on:
  workflow_call:
    inputs:
      dist-artifact-id:
        description: "the release assets artifact (the package job's dist-artifact-id)"
        type: string
        required: true
      sums-sha256:
        description: "the SHA-256 of SHA256SUMS that the package job recorded"
        type: string
        required: true
      archives:
        description: "the JSON list of archives, one SBOM attestation each"
        type: string
        required: true
    outputs:
      sigstore-artifact-id:
        description: "the artifact holding one cosign bundle per release file"
        value: ${{ jobs.files.outputs.sigstore-artifact-id }}

permissions: {}

defaults:
  run:
    shell: bash

env:
  # What every self-check below accepts: this file, called from jabbott-iii/Grimoire on main.
  # The same values as release.yml's publish job; `cargo test -p xtask` fails when they differ.
  COSIGN_IDENTITY: https://github.com/jabbott-iii/Grimoire/.github/workflows/sign.yml@refs/heads/main
  COSIGN_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_REPOSITORY: jabbott-iii/Grimoire
  COSIGN_REF: refs/heads/main

jobs:
  files:
    name: attest and sign the release files
    # Only release.yml on main in this repository (id 1460666977), never another caller.
    if: >-
      github.repository_id == '1460666977'
      && github.workflow_ref == 'jabbott-iii/Grimoire/.github/workflows/release.yml@refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # actions/attest and cosign get their Sigstore signing certificates with the job's OIDC token
      attestations: write # actions/attest stores the provenance attestation on this repository
    outputs:
      sigstore-artifact-id: ${{ steps.upload-sigstore.outputs.artifact-id }}
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      # The artifact is the one the package job uploaded, unchanged, and holds nothing else.
      - name: Check the release assets
        env:
          SUMS_SHA256: ${{ inputs.sums-sha256 }}
        run: |
          set -euo pipefail
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict --quiet -
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          expected="$( (cut -c 67- dist/SHA256SUMS; echo SHA256SUMS) | sort)"
          actual="$(cd dist && find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::dist/ does not hold exactly the files SHA256SUMS lists"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
      # One SLSA provenance attestation whose subjects are every file, SHA256SUMS included.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Keyless: the certificate names this file. Each bundle is checked at once, caller included.
      - name: Sign every file with cosign (keyless)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sigstore"
          for file in dist/*; do
            bundle="${RUNNER_TEMP}/sigstore/$(basename "${file}").sigstore.json"
            cosign sign-blob --yes --bundle "${bundle}" "${file}"
            cosign verify-blob --bundle "${bundle}" \
              --certificate-identity "${COSIGN_IDENTITY}" \
              --certificate-oidc-issuer "${COSIGN_ISSUER}" \
              --certificate-github-workflow-repository "${COSIGN_REPOSITORY}" \
              --certificate-github-workflow-ref "${COSIGN_REF}" "${file}"
          done
      - name: Upload the cosign bundles
        id: upload-sigstore
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sigstore
          path: ${{ runner.temp }}/sigstore/
          if-no-files-found: error

  sboms:
    name: attest SBOM (${{ matrix.archive }})
    if: >-
      github.repository_id == '1460666977'
      && github.workflow_ref == 'jabbott-iii/Grimoire/.github/workflows/release.yml@refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        archive: ${{ fromJSON(inputs.archives) }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # actions/attest gets its Sigstore signing certificate with the job's OIDC token
      attestations: write # actions/attest stores the SBOM attestation on this repository
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      # The artifact is the one the package job uploaded, unchanged, and holds nothing else.
      - name: Check the release assets
        env:
          SUMS_SHA256: ${{ inputs.sums-sha256 }}
        run: |
          set -euo pipefail
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict --quiet -
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          expected="$( (cut -c 67- dist/SHA256SUMS; echo SHA256SUMS) | sort)"
          actual="$(cd dist && find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::dist/ does not hold exactly the files SHA256SUMS lists"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
      - name: Attest the archive's CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ matrix.archive }}
          sbom-path: dist/${{ matrix.archive }}.cdx.json
