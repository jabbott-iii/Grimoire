[workspace]
resolver = "3"
# Code-bearing assets are crates in their own asset directories (docs/01-architecture.md, "Repository layout").
# Cargo rejects a glob that matches nothing, so each kind's glob arrives with its first asset.
members = ["crates/*", "xtask", "catalog/tools/*", "catalog/mcp-servers/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
# The maintainer kept this spelling (2026-11-17, task M1.1 in docs/roadmap.md). Trusted publishers and
# cosign identities match it exactly, so never change its case.
repository = "https://github.com/jabbott-iii/Grimoire"
# Relative to the workspace root when inherited.
readme = "README.md"

[workspace.dependencies]
agent-grimoire-adapters = { path = "crates/agent-grimoire-adapters", version = "0.1.0" }
agent-grimoire-catalog = { path = "crates/agent-grimoire-catalog", version = "0.1.0" }
agent-grimoire-install = { path = "crates/agent-grimoire-install", version = "0.1.0" }
agent-grimoire-model = { path = "crates/agent-grimoire-model", version = "0.1.0" }
agent-grimoire-resolve = { path = "crates/agent-grimoire-resolve", version = "0.1.0" }
# Test fixtures shared by the crates' tests; never published.
agent-grimoire-testkit = { path = "crates/agent-grimoire-testkit" }
# Shared hardening for MCP server assets; never published (ADR-0002).
agent-grimoire-mcp = { path = "crates/agent-grimoire-mcp" }

# >= 4.0.3: earlier 4.x releases are affected by RUSTSEC-2026-0482 (sandbox escape).
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
cap-tempfile = "4.0.3"
clap = { version = "4.6.8", features = ["derive"] }
# O_NONBLOCK for opening files that might have been swapped for a FIFO (Unix only).
libc = "0.2.191"
# Format-preserving JSON edits; always parsed with every non-standard extension off.
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json"] }
# Secret detection in the secret-guard tool.
memchr = "2.8.3"
regex = "1.13.1"
# >= 0.13.6 for RUSTSEC-2026-0414 and RUSTSEC-2026-0433; wikilinks stay disabled.
pulldown-cmark = { version = "0.13.6", default-features = false }
# preserve_order: schema key order follows field order and cannot be flipped by feature unification.
schemars = { version = "1.2.3", features = ["preserve_order"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
# preserve_order: JSON Grimoire writes keeps the key order adapters chose.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
# Unified diffs in `grimoire plan`.
similar = "3.2.1"
spdx = { version = "0.13.6", default-features = false }
toml = "1.2.1"
# Comment-preserving edits to grimoire.toml.
toml_edit = "0.25.19"

# --- MCP servers only (ADR-0002, ADR-0007). The grimoire CLI links none of these. ---
# Unpadded base64url for JWKs in tests.
base64 = "0.23.1"
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
# No crypto backend: a verify-only provider over rsa and p256 is installed at startup (ADR-0007).
jsonwebtoken = { version = "12.0.0", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
# >= 3.9.0 for every published rmcp advisory; auth* and local features stay off (ADR-0007).
rmcp = { version = "3.10.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
# >= 0.10.0: the Marvin attack advisory (RUSTSEC-2023-0071) is patched there. RS256 needs pkcs1v15.
rsa = { version = "0.10.0", default-features = false, features = ["std", "pkcs1v15"] }
# >= 1.54.1 for RUSTSEC-2026-0384.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-std", "sync"] }

# --- Release packaging in xtask only (ADR-0009). The grimoire CLI links none of these. ---
# Deflate for .tar.gz archives and for the small zip writer in xtask/src/release/zip.rs.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
# No xattr support: archives carry only names, modes and contents.
tar = { version = "0.4.46", default-features = false }

insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"

# Release binaries (`cargo xtask release build`, ADR-0009). A profile of its own, so local
# `--release` builds stay fast. panic stays "unwind": hooks rely on a non-zero exit, and
# secret-guard's binding blocks on failure either way.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = "debuginfo"
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

# Stable and enforced from Cargo 1.100 (the pinned toolchain). Older Cargo ignores the table.
[workspace.lints.cargo]
missing_lints_inheritance = "deny"
unknown_lints = "deny"
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
