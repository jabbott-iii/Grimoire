[package]
name = "grimoire-mcp-project-docs"
version = "0.1.0"
description = "A read-only MCP server for a project's documentation and architecture decision records"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Asset crates are never published to crates.io (ADR-0002).
publish = false

[dependencies]
agent-grimoire-mcp.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
clap.workspace = true
rmcp = { workspace = true, features = ["macros"] }
schemars.workspace = true
serde.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "macros"] }
serde_json.workspace = true
tempfile.workspace = true
# Runs the real binary in the protocol tests.
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
