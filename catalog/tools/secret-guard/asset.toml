format = 1
id = "secret-guard"
kind = "tool"
version = "0.1.0"
summary = "Blocks tool calls and prompts that contain likely secrets, and scans files for them"
description = """A Rust command-line tool that finds credentials with documented, distinctive formats (private keys and GitHub, GitLab, AWS, Slack, Stripe, Anthropic, OpenAI, npm and PyPI tokens).

Installed for Claude Code, it registers two hooks. Before any tool call it checks the content the call would write, run or send, and blocks the call if that contains a secret. Before a prompt reaches the model it checks the prompt. Both hooks fail closed: if the binary is missing, crashes or times out, the call or prompt is blocked.

Grimoire configures the hooks; install the `grimoire-tool-secret-guard` binary separately. It also works on its own as `grimoire-tool-secret-guard scan [PATH]...`."""
license = "MIT OR Apache-2.0"
maintainers = ["jabbott-iii"]
tags = ["security", "secrets", "hooks"]
maturity = "experimental"
min-cli-version = "0.1.0"

[permissions]
# `scan` reads the paths it is given. `hook` reads the event on stdin and, for a
# write, the current content of the file it targets (regular files up to 16 MiB,
# never through a symbolic link) to allow a secret that file already holds.
filesystem = "read"
hooks = true

[tool]
binary = "grimoire-tool-secret-guard"
# Every tool call is checked: the binary decides per tool which fields carry new
# content (Write, Edit, Bash, ...) and skips local reads (Read, Grep, Glob).
hooks = [
    { event = "pre-tool-use", args = ["hook"], timeout-secs = 30, on-failure = "block" },
    { event = "user-prompt-submit", args = ["hook"], timeout-secs = 30, on-failure = "block" },
]

[clients.claude-code]
outputs = [{ to = "hooks", strategy = "entry" }]
