[package]
name = "@@BINARY@@"
version = "0.1.0"
description = "One line saying what this MCP server does"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Asset crates are never published to crates.io (ADR-0002).
publish = false

[dependencies]
# Secure transport defaults, limits and OAuth checks (ADR-0007). Required for every server.
agent-grimoire-mcp.workspace = true
clap.workspace = true
rmcp = { workspace = true, features = ["macros"] }
schemars.workspace = true
serde.workspace = true
tokio.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "macros"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
